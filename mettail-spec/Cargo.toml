[package]
name = "mettail-spec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MeTTaIL Unified Specification compiler for .rho module files"
publish = false

[[bin]]
name = "mettail-spec"
path = "src/main.rs"

[dependencies]
mettail-ast = { path = "../mettail-ast" }
anyhow = "1.0"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
indexmap = "2.0"
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { workspace = true }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
