\* ROOT-A — the shared-open `{` prefix-dispatch fork. This configuration
\* proves the fork that lets Rholang Map literals `{1:2}` parse while preserving
\* braced `{P|Q}` parallel is sound: no valid parse lost, at most one accept per
\* content, and no frontier/quotient explosion.

INIT Init
NEXT Next

CONSTANTS
  Scenario = "CollectionFork"
  \* TRUE so the ROOT-B `{|`-delegate lineage (wrap = 1) stays observationally
  \* distinct from the ROOT-A PPar/Map lineages (wrap = 0) under the quotient.
  WrapObservable = TRUE

INVARIANT TypeOK
INVARIANT QuotientSound
INVARIANT NoValidParseLost
INVARIANT AtMostOneAcceptPerContent
INVARIANT NoSnapshotExplosion
INVARIANT DelegateEntersSourceCat
