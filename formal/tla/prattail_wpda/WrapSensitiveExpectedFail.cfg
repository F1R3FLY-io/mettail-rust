\* This configuration is intentionally useful as a counterexample harness:
\* it asks Apalache to prove the narrow cohort quotient while wrap identity
\* is directly observable. A failure means a runtime distinction must be
\* represented by some other ConfigKey axis before EquivKey may drop wrap.

INIT Init
NEXT Next

CONSTANTS
  Scenario = "CohortQuotient"
  WrapObservable = TRUE

INVARIANT TypeOK
INVARIANT NarrowCohortQuotientSafe
