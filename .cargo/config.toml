# Build configuration for faster dev builds.
#
# Uses two optimizations:
#   1. Fast linker (mold on Linux, lld on macOS) — speeds up binary/test linking
#   2. Cranelift codegen backend — replaces LLVM codegen (~59s savings) with a
#      faster alternative. Trade-off: debug/test binaries run ~2.7x slower than LLVM.
#
# Codegen backend selection (per-profile, via Cargo.toml):
#   - dev/test profiles: Cranelift (fast compile, slower runtime), EXCEPT the
#     `gxhash`/`languages` packages, which are scoped to LLVM (see workspace
#     Cargo.toml `[profile.*.package.*]`) because `gxhash` (via `pathmap`) needs
#     target-feature cfg checks that fail under Cranelift in this setup.
#   - release/bench profiles: LLVM (slow compile, optimized runtime)
#   This is configured in workspace Cargo.toml using the unstable `codegen-backend`
#   profile key, enabled by the [unstable] section below.
#
# Prerequisites:
#   Linux: mold linker (https://github.com/rui314/mold)
#     Install: sudo pacman -S mold        (Arch)
#              sudo apt install mold       (Debian/Ubuntu)
#              sudo dnf install mold       (Fedora)
#   macOS: lld linker via LLVM (https://lld.llvm.org/)
#     Install: brew install llvm
#     Ensure llvm bin is in PATH:
#       Apple Silicon: export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
#       Intel Mac:     export PATH="/usr/local/opt/llvm/bin:$PATH"
#   All platforms: nightly toolchain with cranelift (auto-installed via rust-toolchain.toml)
#
# If mold/lld is not installed, comment out the linker and link-arg lines
# for your platform.

# Enable unstable per-profile codegen-backend selection in Cargo.toml
[unstable]
codegen-backend = true

# Rhocalc tests use deep stacks in generated code; the default 2 MiB test thread
# stack can overflow on aarch64 (and under memory pressure). Applies to `cargo test` threads.
[env]
RUST_MIN_STACK = "8388608"

# --- Linux x86_64 ---
[target.x86_64-unknown-linux-gnu]
linker = "clang"
# `target-feature=+aes,+sse2` is required by `gxhash` (pulled transitively via
# `pathmap` → f1r3node-rust `models`, part of the M-RHO integration). Mirrors
# f1r3node-rust/.cargo/config.toml so the cross-repo path deps build under
# mettail-rust's toolchain. All x86_64 CPUs since ~2010 (Westmere) provide these.
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-feature=+aes,+sse2"]

# --- Linux aarch64 (pathmap -> gxhash compile-time cfg; default linker, no mold/clang required) ---
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+aes,+neon"]
# Optional speedup when mold + clang are installed:
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-feature=+aes,+neon"]

# --- Windows x86_64 (pathmap -> gxhash compile-time cfg; same as f1r3node CI RUSTFLAGS) ---
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+aes,+sse2"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+aes,+sse2"]

# --- macOS Apple Silicon ---
[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "target-feature=+aes,+neon"]

# --- macOS Intel ---
[target.x86_64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "target-feature=+aes,+sse2"]
