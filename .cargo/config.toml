# Build configuration for faster dev builds.
#
# Uses two optimizations:
#   1. Fast linker (mold on Linux, lld on macOS) — speeds up binary/test linking
#   2. Cranelift codegen backend — replaces LLVM codegen (~59s savings) with a
#      faster alternative. Trade-off: debug/test binaries run ~2.7x slower than LLVM.
#
# Codegen backend selection (per-profile, via Cargo.toml):
#   - dev/test profiles: Cranelift (fast compile, slower runtime), EXCEPT the
#     `gxhash`/`languages` packages, which are scoped to LLVM (see workspace
#     Cargo.toml `[profile.*.package.*]`) because `gxhash` (via `pathmap`) needs
#     target-feature cfg checks that fail under Cranelift in this setup.
#   - release/bench profiles: LLVM (slow compile, optimized runtime)
#   This is configured in workspace Cargo.toml using the unstable `codegen-backend`
#   profile key, enabled by the [unstable] section below.
#
# Prerequisites:
#   Linux: mold linker (https://github.com/rui314/mold)
#     Install: sudo pacman -S mold        (Arch)
#              sudo apt install mold       (Debian/Ubuntu)
#              sudo dnf install mold       (Fedora)
#   macOS: lld linker via LLVM (https://lld.llvm.org/)
#     Install: brew install llvm
#     Ensure llvm bin is in PATH:
#       Apple Silicon: export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
#       Intel Mac:     export PATH="/usr/local/opt/llvm/bin:$PATH"
#   All platforms: nightly toolchain with cranelift (auto-installed via rust-toolchain.toml)
#
# If mold/lld is not installed, comment out the linker and link-arg lines
# for your platform.

# Enable unstable per-profile codegen-backend selection in Cargo.toml
[unstable]
codegen-backend = true

# RE-ENABLED on the feature/wfst-architecture -> feature/rho-native-set-automata
# merge (2026-07-18). wfst retired this pin (residual #11-2, below) after proving
# its beta::*/rholang term-op frames fit the default 2 MiB. That analysis did NOT
# cover the in-Rho runtime's deep reducer recursion: the current branch's
# `rholang-runtime` test `rho_net_subst_trs_prop::subst_trs_cascade_on_reducer_matches_reference`
# overflows the 2 MiB test-thread stack (observed `fatal runtime error: stack
# overflow` / SIGABRT). That is precisely the "step-frame + harness exceeds 2 MiB
# => re-enable instantly (uncomment)" criterion the retirement note records, so
# the pin is restored. The larger stack is strictly safe for the wfst tests
# (they pass at 2 MiB, hence also at 8 MiB). The frame-peeling receipts below
# remain valid for the term-op drivers; the reducer cascade is a separate path.
#
# --- Original retirement analysis (residual #11-2, 2026-07-14), kept for context ---
# This pin existed because the generated `normalize_iterative` reserved a ~2.24 MB
# MONOLITHIC stack frame ON ENTRY (LLVM -O0 sums every match arm's allocas; the
# five HOL-cross-product Assemble families were unpeeled), overflowing the default
# 2 MiB test-thread stack for every `beta::*` test (input-independent). Residual
# #11-2 peeled those families (+ subst Bind/MBind + match_pattern/display/debug)
# into `#[inline(never)]` helpers. DWARF-CFA census (target/debug/deps/rholang_tests,
# scratchpad/zz_probes/logs_residual_nf/g2_*):
#   normalize_iterative     2,240,888 B -> 45,096 B  (49.7x)
#   match_pattern_iterative 1,481,688 B ->  5,272 B  (281x)
#   subst_iterative           487,976 B -> 45,144 B  (10.8x)
#   display_iterative         385,544 B ->    152 B  (2536x)
#   debug_iterative           275,432 B ->    184 B  (1497x)
# All five term-op drivers (and every peeled helper — max match_visit_proc
# 118,120 B) are now <= 256 KB. Measured beta:: whole-thread high-water at the
# default stack: PASSES at 2 MiB and 1.25 MB, ABORTS at 1.1875 MB => minimum
# ~1.25 MB, ~0.75 MB (60%) headroom. Full rholang_tests (402) + sim_rholang pass
# at the default 2 MiB.
#
# CAVEAT (do not DELETE this block until resolved): the whole-thread high-water is
# now set by the OUT-OF-SCOPE prattail parser `RholangWpdaEngine::step` (1,137,256 B
# = 1.11 MB, unchanged by this fix — a separate residual). That caps the headroom
# at ~1.7x rather than the ~8x the <=256 KB term-op frames alone would give. The
# aarch64 L1 ladder is NOT measurable on this box; the retirement argument is the
# x86_64 receipts + the arch-proportional frame-sum argument. Re-enable instantly
# (uncomment) if aarch64 CI's step-frame + harness exceeds 2 MiB.
#
[env]
RUST_MIN_STACK = "8388608"

# --- Linux x86_64 ---
[target.x86_64-unknown-linux-gnu]
linker = "clang"
# `target-feature=+aes,+sse2` is required by `gxhash` (pulled transitively via
# `pathmap` → f1r3node-rust `models`, part of the M-RHO integration). Mirrors
# f1r3node-rust/.cargo/config.toml so the cross-repo path deps build under
# mettail-rust's toolchain. All x86_64 CPUs since ~2010 (Westmere) provide these.
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-feature=+aes,+sse2"]

# --- Linux aarch64 (pathmap -> gxhash compile-time cfg; default linker, no mold/clang required) ---
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+aes,+neon"]
# Optional speedup when mold + clang are installed:
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-feature=+aes,+neon"]

# --- Windows x86_64 (pathmap -> gxhash compile-time cfg; same as f1r3node CI RUSTFLAGS) ---
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+aes,+sse2"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+aes,+sse2"]

# --- macOS Apple Silicon ---
[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "target-feature=+aes,+neon"]

# --- macOS Intel ---
[target.x86_64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "target-feature=+aes,+sse2"]
