[package]
name = "rholang-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "M-RHO bridge: COMPILE-TIME lowering of a MeTTaIL GSLT (LanguageDef) to a parallel-optimized Rholang VM — rules-as-data + Par, e-graph normalization, WTA/cost-Sig assignment, channel-keying. Depends ONE-WAY on f1r3node-rust."

# Compile-time lowering of a MeTTaIL `LanguageDef` to f1r3node-rust Rholang AST.
# Depends ONE-WAY on f1r3node-rust (proven one-way in
# formal/rocq/rho_bridge/theories/BridgeInertness.v). Fully integrated (no gating).
# `mettail-ast` supplies the LanguageDef/GrammarRule types; `models` supplies the
# normalized `rhoapi::Par` execution artifact consumed directly by the RhoRuntime.

[lib]
name = "mettail_rholang_codegen"

[dependencies]
mettail-ast = { package = "ast", path = "../ast" }
# The runtime `Language`/`Term` trait surface. codegen → runtime is ACYCLIC (runtime
# does not depend on rholang-codegen — the one-way direction BridgeInertness.v records
# for the GroundTerm/Language split), so the FLT public reflector trait
# (`FltReflect: mettail_runtime::Language`, rho_net_flt.rs) can name `Language` here —
# the home `mettail_runtime::Language` itself CANNOT be, since it may not name the
# codegen-owned `GroundTerm` (that reverse edge would cycle).
mettail-runtime = { package = "runtime", path = "../runtime" }
syn = { workspace = true }
models = { workspace = true }
# The set automaton (positional matcher) whose interned pattern DAG the Stage 1
# in-Rho lowering serializes into an sa:-receiver network. codegen → dovetail is
# acyclic (dovetail does not depend on rholang-codegen).
dovetail = { package = "dovetail", path = "../dovetail" }
# BENCHMARK-ONLY (E-3 T-E6B, pgmcp experiment 146 H4v2): the pathmap-0.2.2 trie
# backing the quarantined construction-side fragment store
# (`rho_net_fragment_store`, feature `bench-fragment-store`). Same crates.io
# pin as `runtime`/`languages`/f1r3node `models` (0.2.2 — NOT the 0.3.0 git
# fork macros/prattail use internally). Optional: a default build of this crate
# carries no pathmap linkage.
pathmap = { workspace = true, optional = true }

[features]
# BENCHMARK-ONLY QUARANTINE (Track B): the naive Knotted-Topoi Appendix-A baseline
# emitter (`rho_net_naive_kt`) — a per-rule, unshared receiver scheme emitted from
# the SAME `InRhoMatchingRuleset` as the optimized interned-DAG network, so the two
# can be benchmarked against each other at identical spread/accept interfaces.
# Never enabled by default; no production entry point or macro-generated code
# references the gated module, so a default build is byte-identical with or
# without this table.
bench-naive-baseline = []
# BENCHMARK-ONLY QUARANTINE (E-3 T-E6B, pgmcp experiment 146 H4v2): the
# pathmap-0.2.2-backed construction-side fragment store
# (`rho_net_fragment_store`) — the EM-8 content-hash-equality Lattice over
# `Arc<Fragment>`, the `HashMap` twin arm, and the deterministic
# retained-bytes/invalidation accounting the `--mode e6b` harness consumes.
# Never enabled by default (user decision D3: bench-only extension surface);
# no production entry point or macro-generated code references the gated
# module, and the `pathmap` dependency itself is gated with it.
bench-fragment-store = ["dep:pathmap"]
# BENCHMARK-ONLY QUARANTINE (E-1 scion grafting, pgmcp experiment 147): the
# `ScionPolicy::StructuralScion` codegen surface (`lower_to_par_with_scion_policy`)
# that emits per-rule scion bundles for positional `BaseRewrite` arms, so the
# measurement harness can build the TREATMENT installed program against the CONTROL
# (all-`ContractumRedrive`) arm. Never enabled by default (user decision D3:
# bench-only surface, `DRIVE_OPT_IN` untouched); the scion BUILDER itself is always
# compiled but is only reachable under `StructuralScion`, which this feature gates.
bench-scion = []

[dev-dependencies]
# Property-based tests of the Stage 1 term-spread encoding (arbitrary ground terms
# must spread to exactly one head-tag send per node on the derived location channel).
proptest = "1"
# A-S5.5 no-regression pins: the Lambda `^drive` receiver family and the legacy Ambient
# AC σ-receivers are pinned BYTE-identical across the AC-arm extension by prost-encoding
# the generated `Par`s and comparing length + hash goldens. Same prost version (0.14)
# f1r3node-rust's `models` uses.
prost = "0.14"
