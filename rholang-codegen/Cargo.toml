[package]
name = "rholang-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "M-RHO bridge: COMPILE-TIME lowering of a MeTTaIL GSLT (LanguageDef) to a parallel-optimized Rholang VM — rules-as-data + Par, e-graph normalization, WTA/cost-Sig assignment, channel-keying. Depends ONE-WAY on f1r3node-rust."

# Compile-time lowering of a MeTTaIL `LanguageDef` to f1r3node-rust Rholang AST.
# Depends ONE-WAY on f1r3node-rust (proven one-way in
# formal/rocq/rho_bridge/theories/BridgeInertness.v). Fully integrated (no gating).
# `mettail-ast` supplies the LanguageDef/GrammarRule types; `models` supplies the
# normalized `rhoapi::Par` execution artifact consumed directly by the RhoRuntime.

[lib]
name = "mettail_rholang_codegen"

[dependencies]
mettail-ast = { package = "ast", path = "../ast" }
syn = { workspace = true }
models = { workspace = true }

[dev-dependencies]
# Property-based tests of the Stage 1 term-spread encoding (arbitrary ground terms
# must spread to exactly one head-tag send per node on the derived location channel).
proptest = "1"
