# until 2026-07-28 and a program that publishes nothing is indistinguishable from a correct one
# whose service did not reply: no beat contains a numeral it claims to compute; the closed desk
# publishes nothing while the control fires; and — the teeth — beat 1 with the `!?` deleted
# publishes ONLY the control. The covered surface set is read off the language metadata, so a
# fourth `!?` grammar rule fails the build until the demo shows it.
[[test]]
name = "query_bind_demo"
path = "tests/query_bind_demo.rs"
required-features = ["rholang-runtime", "lambda-runtime", "calculator-runtime"]

# CI gate for the `rholang` binary: runs it on the committed demo `.rho` file and asserts the
# Rholang program (which exercises the grammar's FLT feature) reduces on the reducer — the COMM
# fires, the typed `${x}` holes bind, and the re-quote reconstructs App(I, K) = (λ.0 λ.λ.1) on OUT.
[[test]]
name = "rholang_bin"
path = "tests/rholang_bin.rs"
required-features = ["rholang-runtime", "lambda-runtime", "calculator-runtime"]

# `where`-guard expression lowering + the monadic receive arity, through the production parse and
# lowering path. Pins BOTH directions of the guard matrix (a true guard fires, a false guard does
# not and leaves its datum resting), the send-position diagnostics that share the root, and the
# structural invariant that no `Receive.condition` operand carries process structure.
[[test]]
name = "rholang_guard_lowering"
path = "tests/rholang_guard_lowering.rs"
required-features = ["rholang-runtime"]

# The `!?` QUERY BIND end to end. `for(p <- svc!?(a…)){B}` is request/response sugar for
# `new r in { svc!(*r, a…) | for(p <- r){B} }`; until 2026-07-28 the expansion was computed only
# as a `term_eq` comparison key and thrown away, so the running program emitted NO request send
# and every query rested forever — silently, with exit code 0. Every program in this suite
# carries its own positive control in the same run, every responder relays on the private return
# channel rather than publishing directly, and the covered set of `!?` surfaces is read out of
# the language metadata so a new grammar rule cannot be added without covering it.
[[test]]
name = "rholang_query_bind"
path = "tests/rholang_query_bind.rs"
required-features = ["rholang-runtime"]

# The same matrix through the `rholang` BINARY. A library test cannot catch a regression of the
# binary's PARSE ENTRY (`parse_via_wpda`, never `Proc::parse` — whose display round-trip is not
# term-preserving for a projection operand), because it never goes through it.
[[test]]
name = "rholang_bin_guards"
path = "tests/rholang_bin_guards.rs"
required-features = ["rholang-runtime", "lambda-runtime", "calculator-runtime"]

# Diagnostic probe for the Stage 2 branching engine: the SHAPE of the speculative
# reduction graph (per-level frontier sizes, out-degrees, configuration merges, wall
# time). Not a gate — it exists so "the exploration did not finish" can be diagnosed with
# numbers instead of guesses. Same feature surface as the acceptance gate.
[[test]]
name = "s2_graph_shape_probe"
path = "tests/s2_graph_shape_probe.rs"
required-features = ["ambient-runtime"]

# Stage 2 — the `[*]` / `[n]` ABI seam, end to end: `LookaheadService` given a request's
# operands must produce, in `Par` form, exactly what each of `lookahead.rs`'s report
# channels carries — one BARE term per success branch on the reply channel, `[trace, term]`
# provenance, `[trace, [code, message]]` failures, and `[trace, handle, |E(S)|]` truncations
# whose handle the service takes back and resumes. Pins the wire and the engine against
# each other rather than against their own documentation. Hand-built `Par`s only.
[[test]]
name = "s2_lookahead_service"
path = "tests/s2_lookahead_service.rs"
required-features = ["runtime-report"]

# The child half of `tests/stack_depth_gate.rs`. It is a `[[bin]]` rather than a `#[test]`
# because libtest runs every test on a SPAWNED thread, and the traversal being gated is on the
# MAIN thread — see `src/bin/stack_depth_probe.rs`. The gate reaches it through
# `CARGO_BIN_EXE_stack_depth_probe`, which Cargo sets for integration tests of this package.
[[bin]]
name = "stack_depth_probe"
path = "src/bin/stack_depth_probe.rs"
required-features = ["rholang-runtime"]

# Lightweight main-thread probe for the unconditional observation renderer. Keeping this
# separate from `stack_depth_probe` lets the render-only stack slope be measured without
# compiling the generated Rholang language; see the binary's module documentation.
[[bin]]
name = "observation_depth_probe"
path = "src/bin/observation_depth_probe.rs"
