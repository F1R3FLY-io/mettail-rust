[package]
name = "rholang-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "M-RHO bridge: binds the generated Rholang VM to f1r3node-rust's RhoRuntime/DebruijnInterpreter + native handlers; exposes the RhoBackend seam + real-vs-real differential observation tests. Depends ONE-WAY on f1r3node-rust."

# Binds the mettail-rho-codegen output to a real in-memory f1r3node-rust RhoRuntime
# (InMemoryStoreManager → RSpace → create_rho_runtime), evaluates the lowered
# Rholang, and reads results back for real-vs-real differential observation.
# Threading/scheduling are OWNED BY f1r3node (eval_par/RSpace, tokio). Depends
# ONE-WAY on f1r3node-rust (proven one-way in
# formal/rocq/rho_bridge/theories/BridgeInertness.v). The runtime is always
# integrated; only the heavy generated rholang language is feature-gated below.

[lib]
name = "mettail_rholang_runtime"

[features]
# Rholang integration is a FIRST-CLASS, default-on citizen (MeTTaIL == Rholang 1.4):
# the default surface compiles the AST-first rholang lowering + the source-oracle
# helpers so the end-to-end Rholang-VM integration tests (rho_rholang_ast,
# rho_comm_oracle, rho_guard_oracle, rho_structured_ast_send) build and run on every
# default `cargo nextest --workspace`. `rholang-runtime` transitively enables
# `runtime-report`. The opt-in feature names below are retained only so a
# `--no-default-features` build can still drop the heavy generated-language surface.
default = [
    "rholang-runtime",
    "source-oracle",
    "swap-demo-runtime",
    "ac-demo-runtime",
    "ac-bag-demo-runtime",
    "nl-ac-demo-runtime",
    "ctx-demo-runtime",
    "lambda-demo-runtime",
    "native-demo-runtime",
    "comm-demo-runtime",
    "amb-demo-runtime",
]
# Conversion from typed Rho observation reports into mettail_runtime::RuntimeBackendReport
# plus the generic Language backend installer wrappers.
#
# ★ NO LONGER gates `dep:mettail-runtime`, and no longer gates the `Par` → observation DECODER
# (which moved to `src/observation.rs`). It gates exactly what its name says: the REPORT
# conversion and the installer wrappers. See `src/observation.rs`'s header — the decoder feeds
# `render_par_text`, whose output the `[*]` request server `produce`s onto the LIVE tuplespace,
# so a feature-conditional rendering would be two builds writing different bytes for one deploy.
runtime-report = []
# A-S2 test-only instrumentation: exposes `backend::dstage_instrumentation` (a THREAD-SCOPED
# counter of `checked_complete_dovetail_report` invocations) so downstream integration tests
# (e.g. the REPL's zero-D-stage exec suite) can assert that an ADMITTED exec builds no Dovetail
# report while a deferred exec builds ≥ 1. Production builds never enable this; the crate's own
# unit tests see the counter via `cfg(test)` without it.
# ★ Per-thread, not process-global (defect #145): libtest runs one binary's tests concurrently
# on many threads of ONE process, so a process-global counter let a neighbouring test's report
# land inside another test's before/after bracket — live-red under `cargo test`, invisible under
# `cargo nextest`'s process-per-test. The D-stage always runs on the caller's thread, so a
# thread-scoped delta is exact under both runners. See the module doc in `src/backend.rs`.
dstage-instrumentation = ["runtime-report"]
# Pulls in the generated rholang language for the production-shaped AST-first
# rholang-to-Rho runtime wrapper. The generated values are `rhoapi::Par`, never
# Rholang source text that has to be reparsed.
rholang-runtime = [
    "runtime-report",
    "dep:mettail-ast",
    "dep:mettail-languages",
    "dep:syn",
    "mettail-languages/rholang",
    # The generated stack-safety gate exercises the same public `FltReflect` bridge used by
    # production match/drive reflection. Keeping this forward on the Rholang runtime surface
    # prevents a no-default-features build from silently compiling away that implementation.
    "mettail-languages/rho-codegen",
    # The two-stage Dovetail+Rho Rholang wrapper (`dovetail_rho_backed_rholang`) needs the generated
    # `RholangLanguage::dovetail_report_for` / `dovetail_normal_term` (E2), which are emitted only
    # under the language crate's `dovetail-codegen` feature.
    "mettail-languages/dovetail-codegen",
]
# Pulls in the generated `SwapDemo` language for the Epic 4 (R-5) end-to-end
# dovetail-driven Rho σ-injection equivalence test (`rho_net_equivalence`). Needs
# the generated `dovetail_report_for` (σ population, `dovetail-codegen`) and the
# generated `rho_net_invocation_from_dovetail_to` F-function (`rho-codegen`).
# Task #11 (extended 2026-07-26): the language above is TEST-HOSTED
# (`languages/tests/definitions/`), so the test `#[path]`-includes the definition instead of
# importing `mettail_languages::<lang>`. A `cfg` inside a macro expansion resolves against the
# crate BEING COMPILED, so the expansion's `#[cfg(feature = "rho-codegen")]` /
# `#[cfg(feature = "dovetail-codegen")]` blocks must be satisfied by THIS crate now — see the
# `rho-codegen` / `dovetail-codegen` declarations below. Forwarding
# `mettail-languages/<lang>` would not fail loudly if left in place; it would simply stop
# meaning anything, which is why every forward is removed rather than trimmed.
swap-demo-runtime = ["runtime-report", "rho-codegen", "dovetail-codegen"]
