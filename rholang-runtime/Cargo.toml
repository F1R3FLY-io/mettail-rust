    # in `benches/support/workloads.rs`, which the DRIVER BIN also compiles —
    # bins cannot see dev-dependencies). Same path/version as the dev-dependency.
    "dep:dovetail",
]
# BENCHMARK-ONLY QUARANTINE (E-1 scion grafting, pgmcp experiment 147): the L2
# semantic-validator surface. Supersets `bench-naive-baseline` (the `bench_support`
# `CountingSpace` + counting runtime + the leg-0 DriveTau taxonomy) and
# `runtime-report` (the `DriveObservationSet` OUT/fired/err/fuel readback), and
# forwards `mettail-rholang-codegen/bench-scion` (the
# `RhoNetProgram::lower_to_par_with_scion_policy` StructuralScion codegen). The A/B
# arm-builder (`scion_arm_programs`) + the counting drive-observe
# (`drive_arm_with_counters`) live in `bench_support` under this gate; the
# deterministic W-A/W-B/W-C cells + the SM-8 corrupt-bundle probe run in the
# `scion_grafting` integration test. Never enabled by default (user decision D3:
# bench-only surface, `DRIVE_OPT_IN` untouched — the synthetic ladder defs NAME
# themselves `Lambda` to ride the existing name-gate, SM-8b). No production
# metering/budget surface: budgets are F1r3node's (wallet.txt).
bench-scion = [
    "bench-naive-baseline",
    "runtime-report",
    "mettail-rholang-codegen/bench-scion",
    # E-1 leg W-D (Ambient payoff cell): the W-D scion cell drives the PRODUCTION
    # `Ambient` def (In/Out/Open) through both arms, so the bench-scion surface pulls
    # in the same production Ambient language `rho_net_ambient_full` uses. Bench-only;
    # never default. `--all-features` (the CI gate) already enables `ambient-runtime`,
    # so this only affects a targeted `--features bench-scion` build.
    "ambient-runtime",
]

[dependencies]
mettail-rholang-codegen = { package = "rholang-codegen", path = "../rholang-codegen" }
models = { workspace = true }
# Decode a reflected-term ABI tag string out of a private name's protobuf `id`
# (`decode_reflected_term`): `GPrivateBuilder::new_par_from_string` sets
# `id == <String as prost::Message>::encode_to_vec()`, so `String::decode` is its
# exact inverse. Same `prost` version (0.14) f1r3node-rust's `models` uses.
prost = "0.14"
rholang = { workspace = true }
rho-pure-eval = { workspace = true }
rspace_plus_plus = { workspace = true }
# Guard-discharge diagnostics (`guard_discharge`): the `mettail.lowering.guard` target carrying
# the `W1 GuardStaticallyFalse` refutation event and the evaluator-DISAGREEMENT warning. Same
# facade f1r3node's own guard path logs through (`f1r3fly.rholang.guard` in
# `matcher/match.rs`), so a single subscriber sees both sides of the fence.
tracing = "0.1"
crypto = { workspace = true }
tokio = { workspace = true }
mettail-languages = { package = "languages", path = "../languages", optional = true, default-features = false }
# NON-OPTIONAL since the observation decoder moved to `src/observation.rs` and had to become
# unconditional (its rendering reaches consensus-visible data — see that module's header).
# This costs no additional compilation: `runtime` is ALREADY a non-optional transitive
# dependency of this crate through `rholang-codegen`, in every feature configuration
# (`cargo tree -p rholang-runtime --no-default-features -i runtime`). Same reasoning as
# `mettail-prattail` below: a substrate that decides bytes must not have two decision paths.
mettail-runtime = { package = "runtime", path = "../runtime" }
# NON-OPTIONAL since THE WIRE: `guard_discharge` is available in every feature
# configuration, and its compile-time authority leg is the Dovetail/SFT substrate
# (`mettail_prattail::guard_formula`). Gating the substrate behind a feature would give
# `classify` two decision paths — one substrate-authoritative, one not — which is precisely
# the dual-path shape this tree forbids.
mettail-prattail = { package = "prattail", path = "../prattail" }
mettail-ast = { package = "ast", path = "../ast", optional = true }
syn = { workspace = true, optional = true }
# Reactive single-step COMM stepper (step.rs): a lock-free bounded channel carries the RAW COMM
# payload (Pars) from the worker thread's observer to the REPL driver (no rendering under the
# tuplespace lock). The driver renders via f1r3node's existing (recursive) PrettyPrinter on a
# dedicated LARGE-STACK thread — an interim measure: rather than growing the native stack or forking
# the printer, we run Rholang rendering on a big stack. A properly stack-safe PrettyPrinter is a
# separate f1r3node PR.
crossbeam-channel = "0.5"
async-trait = "0.1"
# A-S4 (fold-contract operand decode): invert the extended-numeric ground `Expr`s
# (`GBigInt`/`GBigRat`/`GFixedPoint` — signed big-endian two's-complement bytes) back to the
# canonical MeTTaIL numerics so the trusted native fold runs on the machine-delivered operand.
# Same version the `runtime` crate's canonical numeric types are built on.
num-bigint = "0.4"
# M-2 (the explicit-stack lowering driver, `rholang_ast::drive`). The driver MATERIALISES a
# handful of nodes mid-traversal — a desugared send head, a held fold's operand and its
# fold-lifted body, an unbound `new` body, a receive's pattern process — and must hand out
# `&'drive Proc` for them while still accepting further allocations. That is exactly a typed
# arena, and this crate is `#![forbid(unsafe_code)]`, so it cannot hand-roll the one the safe
# formulation needs. Adds NO crate to the build graph: `typed-arena 2.0.2` was already in
# `Cargo.lock` as a transitive dependency, and it has no dependencies of its own.
typed-arena = "2.0"
# BENCHMARK-ONLY (Track B, `bench-naive-baseline`): the set automaton, for the
# harness's direct-construction workload rulesets (see the feature's comment).
# Inert unless the quarantined bench feature is enabled.
dovetail = { package = "dovetail", path = "../dovetail", optional = true }

# Task #11 (extended 2026-07-26): the TEST-HOSTED demo definitions are `#[path]`-included by
# the `rho_net_*_firing` tests, by `benches/support/workloads.rs`, and — through that shared
# module — by the two `[[bin]]` bench DRIVERS. Those builds expand `language!` themselves and
# so need the macro plus the crates the expansion names, which were previously reached only
# transitively through `mettail-languages`.
#
# These are NORMAL optional dependencies rather than dev-dependencies on purpose: a `[[bin]]`
# target does NOT see `[dev-dependencies]`, so `bench_sa_vs_naive_driver` and
# `bench_e6a_pathmap_driver` would fail with `unresolved import mettail_macros`. They are
# `optional` and reached only through the (non-default) demo `*-runtime` features, so no
# production build pulls them in.
