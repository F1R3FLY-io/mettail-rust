[package]
name = "rholang-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "M-RHO bridge: binds the generated Rholang VM to f1r3node-rust's RhoRuntime/DebruijnInterpreter + native handlers; exposes the RhoBackend seam + real-vs-real differential observation tests. Depends ONE-WAY on f1r3node-rust."

# Binds the mettail-rho-codegen output to a real in-memory f1r3node-rust RhoRuntime
# (InMemoryStoreManager → RSpace → create_rho_runtime), evaluates the lowered
# Rholang, and reads results back for real-vs-real differential observation.
# Threading/scheduling are OWNED BY f1r3node (eval_par/RSpace, tokio). Depends
# ONE-WAY on f1r3node-rust (proven one-way in
# formal/rocq/rho_bridge/theories/BridgeInertness.v). The runtime is always
# integrated; only the heavy generated rhocalc language is feature-gated below.

[lib]
name = "mettail_rholang_runtime"

[features]
# Rholang integration is a FIRST-CLASS, default-on citizen (MeTTaIL == Rholang 1.4):
# the default surface compiles the AST-first rhocalc lowering + the source-oracle
# helpers so the end-to-end Rholang-VM integration tests (rho_rhocalc_ast,
# rho_comm_oracle, rho_guard_oracle, rho_structured_ast_send) build and run on every
# default `cargo nextest --workspace`. `rhocalc-runtime` transitively enables
# `runtime-report`. The opt-in feature names below are retained only so a
# `--no-default-features` build can still drop the heavy generated-language surface.
default = [
    "rhocalc-runtime",
    "source-oracle",
    "swap-demo-runtime",
    "ac-demo-runtime",
    "ctx-demo-runtime",
]
# Conversion from typed Rho observation reports into mettail_runtime::RuntimeBackendReport
# plus the generic Language backend installer wrappers.
runtime-report = ["dep:mettail-runtime", "dep:mettail-prattail"]
# Pulls in the generated rhocalc language for the production-shaped AST-first
# rhocalc-to-Rho runtime wrapper. The generated values are `rhoapi::Par`, never
# Rholang source text that has to be reparsed.
rhocalc-runtime = [
    "runtime-report",
    "dep:mettail-ast",
    "dep:mettail-languages",
    "dep:syn",
    "mettail-languages/rhocalc",
    # The two-stage Dovetail+Rho RhoCalc wrapper (`dovetail_rho_backed_rhocalc`) needs the generated
    # `RhoCalcLanguage::dovetail_report_for` / `dovetail_normal_term` (E2), which are emitted only
    # under the language crate's `dovetail-codegen` feature.
    "mettail-languages/dovetail-codegen",
]
# Pulls in the generated `SwapDemo` language for the Epic 4 (R-5) end-to-end
# dovetail-driven Rho σ-injection equivalence test (`rho_net_equivalence`). Needs
# the generated `dovetail_report_for` (σ population, `dovetail-codegen`) and the
# generated `rho_net_invocation_from_dovetail_to` F-function (`rho-codegen`).
swap-demo-runtime = [
    "runtime-report",
    "dep:mettail-languages",
    "mettail-languages/swap-demo",
    "mettail-languages/dovetail-codegen",
    "mettail-languages/rho-codegen",
]
# Stage AC-U3: pulls in the generated `AcDemo` language for the end-to-end in-Rho AC
# firing test (`rho_net_ac_firing`) — a generated HashBag AC rewrite `PPar{x, ...rest} ~>
# Wrap(x)` firing as a COMM on the reducer. Needs the generated `dovetail_report_for` (AC σ
# population, `dovetail-codegen`) and the AC σ-injection F-function (`rho-codegen`).
ac-demo-runtime = [
    "runtime-report",
    "dep:mettail-languages",
    "mettail-languages/ac-demo",
    "mettail-languages/dovetail-codegen",
    "mettail-languages/rho-codegen",
]
# Stage 3a: pulls in the generated `CtxDemo` language for the end-to-end in-Rho CONTEXTUAL
# firing test (`rho_net_contextual_firing`) — a generated unary congruence rewrite
# `WrapCong: | S ~> T |- Wrap(S) ~> Wrap(T)` firing as an atomic JOIN COMM on the reducer.
# Needs the generated `dovetail_report_for` (premise σ population, `dovetail-codegen`) and the
# contextual σ-injection F-function (`rho-codegen`).
ctx-demo-runtime = [
    "runtime-report",
    "dep:mettail-languages",
    "mettail-languages/ctx-demo",
    "mettail-languages/dovetail-codegen",
    "mettail-languages/rho-codegen",
]
# Backward-compatible test/oracle feature name. New production code should use
# `rhocalc-runtime` directly.
oracle-rhocalc = ["rhocalc-runtime"]
# Enables hand-authored Rholang source evaluation helpers used only by
# source-oracle regression tests. Generated backend execution remains AST-first:
# the production boundary is `ValidatedRhoProgram` / `PlannedRhoBackend`, not
# source text that will be reparsed.
source-oracle = []

[dependencies]
mettail-rholang-codegen = { package = "rholang-codegen", path = "../rholang-codegen" }
models = { workspace = true }
# Decode a reflected-term ABI tag string out of a private name's protobuf `id`
# (`decode_reflected_term`): `GPrivateBuilder::new_par_from_string` sets
# `id == <String as prost::Message>::encode_to_vec()`, so `String::decode` is its
# exact inverse. Same `prost` version (0.14) f1r3node-rust's `models` uses.
prost = "0.14"
rholang = { workspace = true }
rho-pure-eval = { workspace = true }
rspace_plus_plus = { workspace = true }
crypto = { workspace = true }
tokio = { workspace = true }
mettail-languages = { package = "languages", path = "../languages", optional = true, default-features = false }
mettail-runtime = { package = "runtime", path = "../runtime", optional = true }
mettail-prattail = { package = "prattail", path = "../prattail", optional = true }
mettail-ast = { package = "ast", path = "../ast", optional = true }
syn = { workspace = true, optional = true }
# Reactive single-step COMM stepper (step.rs): a lock-free bounded channel carries the RAW COMM
# payload (Pars) from the worker thread's observer to the REPL driver (no rendering under the
# tuplespace lock). The driver renders via f1r3node's existing (recursive) PrettyPrinter on a
# dedicated LARGE-STACK thread — an interim measure: rather than growing the native stack or forking
# the printer, we run Rholang rendering on a big stack. A properly stack-safe PrettyPrinter is a
# separate f1r3node PR.
crossbeam-channel = "0.5"
async-trait = "0.1"

[dev-dependencies]
# The translator (LanguageDef → Rholang) + a parsed calculator fragment, to drive
# the RhoRuntime run / differential oracle.
mettail-ast = { package = "ast", path = "../ast" }
mettail-dovetail-runtime = { package = "dovetail-runtime", path = "../dovetail-runtime" }
mettail-rholang-adapter = { package = "rholang-adapter", path = "../rholang-adapter" }
syn = { workspace = true }
# Property-based testing of the Stage 0 multi-firing replay (arbitrary SwapDemo
# terms: replay observations must equal the Dovetail report's per-firing RHS[σ]).
proptest = "1"
# The set automaton, to compile a pattern into the positional automaton the Stage 1
# in-Rho matching test (`rho_net_equivalence`) serializes and runs on the interpreter.
dovetail = { package = "dovetail", path = "../dovetail" }

[[test]]
name = "rho_rhocalc_ast"
path = "tests/rho_rhocalc_ast.rs"
required-features = ["rhocalc-runtime"]

[[test]]
name = "rho_structured_ast_send"
path = "tests/rho_structured_ast_send.rs"
required-features = ["runtime-report"]

[[test]]
name = "rho_net_injection_demo"
path = "tests/rho_net_injection_demo.rs"
required-features = ["runtime-report"]

[[test]]
name = "rho_net_equivalence"
path = "tests/rho_net_equivalence.rs"
required-features = ["swap-demo-runtime"]

[[test]]
name = "rho_net_ac_firing"
path = "tests/rho_net_ac_firing.rs"
required-features = ["ac-demo-runtime"]

[[test]]
name = "rho_net_contextual_firing"
path = "tests/rho_net_contextual_firing.rs"
required-features = ["ctx-demo-runtime"]

[[test]]
name = "rho_comm_oracle"
path = "tests/rho_comm_oracle.rs"
required-features = ["source-oracle"]

[[test]]
name = "rho_guard_oracle"
path = "tests/rho_guard_oracle.rs"
required-features = ["source-oracle"]
