# `BoundTerm` derive → `::moniker`; `random_generation.rs` → `rand`; `env_types.rs` /
# `subst.rs` env maps → `indexmap`; the Dovetail report compiler → `rigail`.
mettail-macros = { package = "macros", path = "../macros", optional = true }
rigail = { path = "../rigail", optional = true }
moniker = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
