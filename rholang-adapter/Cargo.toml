[package]
name = "rholang-adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MeTTaIL resource-analysis adapter for the host OslfResourceLogic trait"

# Pure resource analysis over an already-lowered Par. It implements the host
# OslfResourceLogic<MettaGslt> trait through delta_sigma. No RSpace or Tokio.
# The host core does not depend on this crate. Mandatory Cargo dependencies
# do not imply that the production offered-funded path invokes this adapter.

[lib]
name = "mettail_rholang_adapter"

[dependencies]
models.workspace = true
rholang.workspace = true

[dev-dependencies]
proptest = "1"
