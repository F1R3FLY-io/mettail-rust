[package]
name = "repl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "mettail_repl"

[features]
default = ["rho-languages"]
bundled-languages = ["dep:mettail-languages", "dep:mettail-dovetail-runtime"]
# Install the production runtime backends so `exec` works: Lambda/Ambient → Dovetail (generic
# `dovetail_backed`); RhoCalc → two-stage Dovetail+Rholang; Calculator → two-stage Dovetail+Rholang
# (E3 fold-dataflow). Pulls f1r3node (via rholang-runtime); a Dovetail-only build can opt out by
# building `--no-default-features --features bundled-languages` (Lambda/Ambient still get Dovetail).
rho-languages = [
    "bundled-languages",
    "dep:mettail-rholang-runtime",
    "dep:mettail-rholang-codegen",
]

# No explicit [[bin]]: Cargo auto-detects `src/main.rs` as the `repl` binary. The canonical
# `mettail` binary is owned solely by the root meta-package (which builds this same
# `repl/src/main.rs` via its own [[bin]] + `default-run`), so declaring a second `mettail` bin
# here would collide on the `target/debug/mettail` output path. `cargo run -p repl` runs the
# auto-detected `repl` bin; `cargo run` / `cargo run --bin mettail` run the root's `mettail`.

[dependencies]
# Core MeTTaIL
mettail-runtime = { package = "runtime", path = "../runtime" }
mettail-languages = { package = "languages", path = "../languages", optional = true }
mettail-macros = { package = "macros", path = "../macros" }
mettail-query = { package = "query", path = "../query" }

# Production runtime backends for `exec` (behind `rho-languages` / `bundled-languages`).
mettail-dovetail-runtime = { package = "dovetail-runtime", path = "../dovetail-runtime", optional = true }
mettail-rholang-runtime = { package = "rholang-runtime", path = "../rholang-runtime", optional = true }
mettail-rholang-codegen = { package = "rholang-codegen", path = "../rholang-codegen", optional = true }

moniker = {workspace = true}

# CLI
rustyline = "14.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

rand = { workspace = true }


[dev-dependencies]
# A-S2 zero-D-stage exec tests: the instrumentation counter around
# `checked_complete_dovetail_report` (a test-only feature; production dependencies above never
# enable it). Feature unification turns the counter on for THIS crate's test builds only.
mettail-rholang-runtime = { package = "rholang-runtime", path = "../rholang-runtime", features = [
    "dstage-instrumentation",
] }
# A-S4 value-absence probes (`zero_dstage_exec.rs`): byte-level checks that the injected call
# `Par` does NOT embed the host-computed result literal (prost encoding of `models::rhoapi::Par`,
# the A-S3 probe style) — and the arbitrary-precision expected values for RhoCalc observations.
models = { workspace = true }
prost = "0.14"
num-bigint = "0.4"
