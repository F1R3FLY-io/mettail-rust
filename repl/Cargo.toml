[package]
name = "repl"
version = "0.1.0"
edition = "2021"

[lib]
name = "mettail_repl"

[features]
default = ["bundled-languages"]
bundled-languages = ["dep:mettail-languages"]

[[bin]]
name = "mettail"
path = "src/main.rs"
doc = false  # Same binary as root package; document only from workspace root to avoid path collision

[dependencies]
# Core MeTTaIL
mettail-runtime = { package = "runtime", path = "../runtime" }
mettail-languages = { package = "languages", path = "../languages", optional = true }
mettail-macros = { package = "macros", path = "../macros" }
mettail-query = { package = "query", path = "../query" }

moniker = {workspace = true}

# CLI
rustyline = "14.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

rand = { workspace = true }


[dev-dependencies]
