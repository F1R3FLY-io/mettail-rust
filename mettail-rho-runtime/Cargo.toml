[package]
name = "mettail-rho-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "M-RHO bridge: binds the generated Rholang VM to f1r3node-rust's RhoRuntime/DebruijnInterpreter + native handlers; exposes the RhoBackend seam + the differential oracle vs Ascent. Depends ONE-WAY on f1r3node-rust."

# Binds the mettail-rho-codegen output to a real in-memory f1r3node-rust RhoRuntime
# (InMemoryStoreManager → RSpace → create_rho_runtime), evaluates the lowered
# Rholang, and reads results back for the differential oracle. Threading/scheduling
# are OWNED BY f1r3node (eval_par/RSpace, tokio). Depends ONE-WAY on f1r3node-rust
# (proven one-way in formal/rocq/rho_bridge/theories/BridgeInertness.v). The
# runtime is always integrated; only the heavy generated-language Ascent oracle
# is feature-gated below.

[features]
default = []
# Enables conversion from typed Rho observation reports into
# mettail_runtime::RuntimeBackendReport, the generic Language backend report
# surface used by generated backends.
runtime-report = ["dep:mettail-runtime"]
# Pulls in the generated MeTTaIL language suite for the two-backend
# Rho-vs-Ascent differential oracle. Kept explicit so source-level Rho machine
# tests do not compile every generated language.
oracle-ascent = ["runtime-report", "dep:mettail-languages", "mettail-languages/calculator"]
# Pulls in the generated rhocalc language only for the AST-first rhocalc-to-Rho
# oracle. This keeps the Rholang process lowering independent from the legacy
# calculator/Ascent oracle feature.
oracle-rhocalc = ["runtime-report", "dep:mettail-languages", "mettail-languages/rhocalc"]

[dependencies]
mettail-rho-codegen = { path = "../mettail-rho-codegen" }
models = { workspace = true }
rholang = { workspace = true }
rho-pure-eval = { workspace = true }
rspace_plus_plus = { workspace = true }
crypto = { workspace = true }
tokio = { workspace = true }
mettail-languages = { path = "../languages", optional = true, default-features = false }
mettail-runtime = { path = "../runtime", optional = true }

[dev-dependencies]
# The translator (LanguageDef → Rholang) + a parsed calculator fragment, to drive
# the RhoRuntime run / differential oracle.
mettail-ast = { path = "../ast" }
mettail-rho-adapter = { path = "../mettail-rho-adapter" }
syn = { workspace = true }

[[test]]
name = "rho_vs_ascent"
path = "tests/rho_vs_ascent.rs"
required-features = ["oracle-ascent"]

[[test]]
name = "rho_rhocalc_ast"
path = "tests/rho_rhocalc_ast.rs"
required-features = ["oracle-rhocalc"]
