description = "M-RHO bridge: binds the generated Rholang VM to f1r3node-rust's RhoRuntime/DebruijnInterpreter + native handlers; exposes the RhoBackend seam + the differential oracle vs Ascent. Depends ONE-WAY on f1r3node-rust."

# Binds the mettail-rho-codegen output to a process-wide RhoRuntime /
# DebruijnInterpreter + native handlers, and hosts the differential oracle
# (rho-backend normal forms vs Ascent normal forms, weight-erased + eqrel-quotiented,
# keyed by dovetail's exact ContentKey). Threading/scheduling are OWNED BY f1r3node
# (eval_par/RSpace, tokio); MeTTaIL emits `Par`, never forks. Depends ONE-WAY on
# f1r3node-rust (proven one-way in formal/rocq/rho_bridge/theories/BridgeInertness.v).
# Fully integrated (no feature gating). The RhoBackend seam + oracle land in
# M-RHO.0.4 (rholang/dovetail deps), the real RhoRuntime run in M-RHO.0.5
# (rspace_plus_plus + casper + tokio).

[dependencies]
