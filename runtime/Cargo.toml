[package]
name = "runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime support library for MeTTaIL - provides variable binding and substitution utilities"
keywords = ["language", "runtime", "binding", "substitution"]
categories = ["development-tools"]
readme = "../README.md"
publish = false

[lib]
name = "mettail_runtime"

[dependencies]
moniker = { workspace = true }
rustc-hash = "2.0"
# Insertion-order-preserving map, used by HashMapLit for deterministic
# keys()/values() iteration order.
indexmap = "2"
syn = { workspace = true }
proc-macro2 = { workspace = true }
# Runtime re-exports PraTTaIL predicate parser/behavioral-predicate helpers.
mettail-prattail = { package = "prattail", path = "../prattail" }
# PathMap trie (M-RHO) — pin matches f1r3node-rust `models` 0.2.2; backs PathMapLit/pathmap_bridge.
pathmap = { workspace = true }
# Main-branch numeric types (BigInt, BigRat, FixedPoint).
num-bigint = "0.4"
num-integer = "0.1"
num-rational = { version = "0.4", features = ["num-bigint-std"] }
num-traits = "0.2"

[dev-dependencies]
libc = "0.2"
proptest = "1"

[[test]]
name = "formula_pda_stack_gate"
path = "tests/formula_pda_stack_gate.rs"

# The child half of `formula_pda_stack_gate`. The ordinary libtest parent remains discoverable by
# Cargo and nextest, while this standalone binary executes the measured traversal on its process's
# main thread after the parent constrains `RLIMIT_STACK` before `exec`.
[[bin]]
name = "formula_pda_depth_probe"
path = "tests/support/formula_pda_depth_probe.rs"
