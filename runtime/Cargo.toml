[package]
name = "mettail-runtime"
version = "0.1.0"
edition = "2021"
authors = ["MeTTaIL Contributors"]
license = "MIT"
description = "Runtime support library for MeTTaIL - provides variable binding and substitution utilities"
repository = "https://github.com/your-username/mettail-rust"
homepage = "https://github.com/your-username/mettail-rust"
keywords = ["language", "runtime", "binding", "substitution"]
categories = ["development-tools"]
readme = "../README.md"

[dependencies]
moniker = { workspace = true }
rustc-hash = "2.0"
# Insertion-order-preserving map, used by HashMapLit for deterministic
# keys()/values() iteration order.
indexmap = "2"
syn = { workspace = true }
proc-macro2 = { workspace = true }
# Runtime re-exports PraTTaIL predicate parser/behavioral-predicate helpers.
mettail-prattail = { path = "../prattail" }
# Main-branch numeric types (BigInt, BigRat, FixedPoint).
num-bigint = "0.4"
num-integer = "0.1"
num-rational = { version = "0.4", features = ["num-bigint-std"] }
num-traits = "0.2"

[dev-dependencies]
proptest = "1"
