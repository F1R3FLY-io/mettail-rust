name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned f1r3node-rust sibling
        shell: bash
        run: bash scripts/ci/checkout-f1r3node-sibling.sh

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install lld linker (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install lld
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Install Rust (nightly)
        if: matrix.rust == 'nightly'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustc-codegen-cranelift-preview

      - name: Install Rust (stable)
        if: matrix.rust == 'stable'
        uses: dtolnay/rust-toolchain@stable

      - name: Remove nightly-only config (stable + Windows)
        if: matrix.rust == 'stable' || runner.os == 'Windows'
        shell: bash
        run: |
          sed -i.bak '/codegen-backend/d' Cargo.toml
          sed -i.bak '/codegen-backend/d' .cargo/config.toml

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Neither `cargo nextest run` nor `cargo test` builds bench targets, so a bench
      # that stops compiling passes every other gate silently. That is not theoretical:
      # `SyntaxItemSpec::TokenKindCapture` was added to the enum without updating the two
      # exhaustive matches in `prattail/benches/bench_specs/mod.rs`, and the break sat at
      # HEAD long enough to block `--all-targets` for every crate — which in turn pushed
      # several verification runs onto crate-scoped evidence and caused two failures to be
      # misattributed to concurrent work. `--all-targets` compiles benches and examples too,
      # so an exhaustive match that loses a variant fails HERE, by name, at the commit that
      # introduced it. Check-only: this builds nothing that is run, and adds no test time.
      - name: Compile every target (benches and examples included)
        run: cargo check -j1 --workspace --all-features --all-targets

      # `--all-features` is one point in the feature lattice, and every gate above sits on it.
      # The OPPOSITE end was never built, so it rotted: `rholang-runtime`'s `par_verbatim` was
      # `#[cfg(feature = "runtime-report")]` while a caller on the crate's UNCONDITIONAL public
      # surface was not, and `--no-default-features` had not compiled for an unknown span of
      # commits. Nothing reported it, because nothing built it.
      #
      # Both ends, and only both ends: a full lattice sweep is exponential and is not the claim.
      # A `#[cfg]` that disagrees with its caller's `#[cfg]` shows up at ONE of the two extremes,
      # which is the class this catches. Check-only, so it adds no test time.
      - name: Compile the opposite end of the feature lattice (no default features)
        run: cargo check -j1 --workspace --no-default-features

      - name: Run tests (nextest, ci profile — bounded slow-timeouts)
        run: >
          cargo nextest run --profile ci -j1
          -p ast
          -p ascent_syntax_export
          -p macros
          -p prattail
          -p rigail
          -p runtime
          -p query
          -p testkit
          -p dovetail

      # nextest does not execute doctests, so they run separately or not at all.
      #
      # This list is an ENUMERATION, and an enumeration written once silently omits
      # whatever is added later. It did: the workspace has 16 members plus the root
      # `mettail`, and `simulation` and `dovetail-runtime` were in none of the
      # doctest steps on x86. `simulation` was carrying two examples that had never
      # been compiled by any gate on this runner.
      #
      # `--workspace` is NOT the fix, and the reason is a measurement, not a
      # preference: `languages`, `repl`, and the root `mettail` reach the f1r3node
      # sibling (`cargo tree` counts 6, 19, and 19 edges into
      # ../f1r3node-rust-mettail), and they also drag in a full `languages` build.
      # Their doctests run in `rho-backend`, which clones that sibling and builds
      # `languages` already. The two crates added here reach it ZERO times, so they
      # cost this job nothing but their own compile.
      #
      # The pinned sibling checkout above also makes the workspace-wide metadata and
      # `macros`' six `rholang-codegen` edges reproducible in this job. The split below
      # remains useful because the heavier sibling-dependent doctests are already paid
      # for in `rho-backend`.
      #
      # `rholang-{codegen,adapter,runtime}` are covered by `rho-backend`'s plain
      # `cargo test -p …`, which runs doctests. `languages` is NOT covered by that
      # job's `--test rholang_tests` step: `--test X` selects only that one target
      # and excludes doctests.
      - name: Run doctests
        run: >
          cargo test --doc -j1
          -p ast
          -p ascent_syntax_export
          -p macros
          -p prattail
          -p rigail
          -p runtime
          -p query
          -p testkit
          -p dovetail
          -p simulation
          -p dovetail-runtime

  dovetail-exhaustive:
    name: Dovetail Exhaustive Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned f1r3node-rust sibling
        shell: bash
        run: bash scripts/ci/checkout-f1r3node-sibling.sh

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-dovetail-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-dovetail-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-dovetail-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Dovetail unit and integration tests
        run: cargo test -p dovetail --all-targets

      - name: Dovetail high-case property tests
        run: PROPTEST_CASES=2048 cargo test -p dovetail --test properties

      - name: Dovetail rewrite inventory audits
        run: cargo test -p ast --test dovetail_rewrite_coverage --test dovetail_language_inventory

      - name: MeTTaIL-shaped Dovetail parity harness
        run: DOVETAIL_PARITY_CASES=512 cargo test -p dovetail --test language_shape_parity

      - name: Dovetail coverage threshold
        run: cargo llvm-cov -p dovetail --fail-under-lines 90
        env:
          CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm

  test-linux-arm64:
    name: Test Suite (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned f1r3node-rust sibling
        shell: bash
        run: bash scripts/ci/checkout-f1r3node-sibling.sh

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-nightly-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all-features --workspace

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned f1r3node-rust sibling
        shell: bash
        run: bash scripts/ci/checkout-f1r3node-sibling.sh
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check MeTTaIL workspace formatting
        run: >
          cargo fmt
          -p ast
          -p ascent_syntax_export
          -p macros
          -p prattail
          -p rigail
          -p runtime
          -p query
          -p testkit
          -p dovetail
          -p rholang-codegen
          -p rholang-adapter
          -p rholang-runtime
          -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned f1r3node-rust sibling
        shell: bash
        run: bash scripts/ci/checkout-f1r3node-sibling.sh
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustc-codegen-cranelift-preview
      - name: Core Dovetail clippy
        run: cargo clippy -j1 -p dovetail --all-targets -- -D warnings
      - name: Rho runtime bridge clippy
        run: >
          cargo clippy --no-deps -j1
          -p rholang-codegen
          -p rholang-adapter
          -p rholang-runtime
          --all-targets
          -- -D warnings

  prattail-gates:
    name: Prattail Lints & Feature Rot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned f1r3node-rust sibling
        shell: bash
        run: bash scripts/ci/checkout-f1r3node-sibling.sh
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustc-codegen-cranelift-preview
      # No `-D warnings`: prattail carries pre-existing style lints outside this
      # campaign's scope. The gate is the crate-level Phase-5 attribute
      # `#![cfg_attr(not(test), deny(clippy::unwrap_used))]` — a reintroduced
      # production `.unwrap()` makes this step exit non-zero on its own.
      - name: Prattail clippy (enforces deny(clippy::unwrap_used) on the production path)
        run: cargo clippy -j1 -p prattail --all-targets

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned f1r3node-rust sibling
        shell: bash
        run: bash scripts/ci/checkout-f1r3node-sibling.sh
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview
      - name: Core and Rho bridge docs
        run: >
          cargo doc --no-deps
          -p dovetail
          -p rholang-codegen
          -p rholang-adapter
          -p rholang-runtime
        env:
          RUSTDOCFLAGS: -D warnings

  rho-backend:
    name: Rho Backend Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned f1r3node-rust sibling
        shell: bash
        run: bash scripts/ci/checkout-f1r3node-sibling.sh

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview

      - name: Rho codegen gate
        run: cargo test -j1 -p rholang-codegen

      - name: Rho adapter gate
        run: cargo test -j1 -p rholang-adapter

      - name: Rho runtime gate
        run: cargo test -j1 -p rholang-runtime

      - name: rholang parser/runtime corpus gate
        run: cargo test -j1 -p languages --no-default-features --features rholang --test rholang_tests

      # The three gates above run doctests as a side effect of plain `cargo test -p …`.
      # The step above them does NOT: `--test rholang_tests` selects exactly that one
      # target, so `languages`' doctests were run by no job on x86 — only by the ARM64
      # `--all-features --workspace` job.
      #
      # These three live here rather than in `test` because they reach the f1r3node
      # sibling this job clones (`cargo tree` counts 6 edges for `languages`, 19 for
      # `repl`, 19 for the root `mettail`) and because `languages` is already built
      # above, so the marginal cost is the doctest compile alone.
      #
      # `languages` currently reports 40 doctests, all `ignored`: they are the
      # `generate_random_at_depth` examples emitted into `target/generated/` by
      # `macros/src/gen/term_gen/random.rs`, whose `ignore` is justified at the
      # emitting site (the example names a category type that only exists in the
      # generated crate). `repl` and the root `mettail` report zero doctests today —
      # they are enumerated so that the FIRST one anyone writes is compiled, which is
      # the property this step buys and the reason a count of zero is not a reason to
      # leave a package out.
      - name: Rho-side doctests (sibling-dependent packages)
        run: cargo test --doc -j1 -p languages -p repl -p mettail

      # Retired in P6 (Ascent backend removal): the `oracle-ascent` feature and the
      # `rho_vs_ascent` test no longer exist, so this differential-oracle step is dead
      # (it would fail with "unknown feature `oracle-ascent`"). Kept commented for history.
      # - name: Rho-vs-Ascent differential oracle
      #   run: cargo test -j1 -p rholang-runtime --features oracle-ascent --test rho_vs_ascent

  formal-rho-dovetail:
    name: Rho/Dovetail Rocq Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache opam switch
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-coq-9.1.1-${{ hashFiles('formal/**/*.v', 'dovetail/formal/rocq/**/*.v') }}
          restore-keys: |
            ${{ runner.os }}-opam-coq-9.1.1-

      - name: Install opam prerequisites
        run: sudo apt-get update && sudo apt-get install -y opam m4 pkg-config libgmp-dev

      - name: Install Rocq 9.1.1
        run: |
          opam init --bare --disable-sandboxing -y
          if ! opam switch list --short | grep -qx mettail-rocq; then
            opam switch create mettail-rocq ocaml-base-compiler.5.4.1 coq.9.1.1 -y
          fi
          opam switch set mettail-rocq
          opam exec -- coqc --version

      - name: Rho bridge Rocq gate
        run: |
          opam exec -- sh -lc 'ulimit -Sv 6291456; FORMAL_CAPPED_RUN=1 make -C formal -j1 rocq-rho-bridge'

      - name: Dovetail Rocq gate
        run: |
          opam exec -- sh -lc 'ulimit -Sv 6291456; FORMAL_CAPPED_RUN=1 make -C formal -j1 rocq-dovetail'

      - name: Dovetail requirements Rocq gate
        run: |
          opam exec -- sh -lc 'ulimit -Sv 6291456; FORMAL_CAPPED_RUN=1 make -C formal -j1 rocq-dovetail-requirements'

      - name: Critical zero-admission Rocq gate
        run: |
          opam exec -- sh -lc 'ulimit -Sv 6291456; FORMAL_CAPPED_RUN=1 make -C formal -j1 rocq-critical-zero-admission'

  architecture-docs:
    name: Rho-Native Architecture Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mettail-rust

      - uses: actions/checkout@v4
        with:
          repository: F1R3FLY-io/f1r3node-rust
          ref: 6781d1d671cc0b98b9de946b3871bdbb8e7f1280
          path: f1r3node-rust

      - name: Install documentation validation tools
        run: sudo apt-get update && sudo apt-get install -y plantuml ripgrep

      - name: Validate Rho-native architecture docs
        working-directory: mettail-rust
        run: docs/architecture/rho-native-integration/validate.sh

  benchmarks:
    name: Benchmark Regression Check (advisory)
    # PR-only + advisory: shared GitHub runners are too noisy for a hard perf
    # gate, so this comments regressions on the PR but never fails CI
    # (fail-on-alert: false). The authoritative perf gate is the local
    # taskset + performance-governor optimization-ledger (campaign Phase 6).
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned f1r3node-rust sibling
        shell: bash
        run: bash scripts/ci/checkout-f1r3node-sibling.sh

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-bench-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: cargo bench -p prattail --bench bench_end_to_end -- --output-format bencher | tee output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          alert-threshold: '120%'
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          comment-on-alert: true
