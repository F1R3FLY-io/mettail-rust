[workspace]
members = ["ast", "macros", "runtime", "languages", "repl", "prattail", "ascent_syntax_export", "query", "testkit", "simulation", "dovetail", "dovetail-runtime", "rigail",
    "rholang-codegen", "rholang-runtime", "rholang-adapter",
]
resolver = "2"

[package]
name = "mettail"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "mettail"
publish = false

# ── The single declaration site for specification-related paths ──────────────────
# Read by `ast::manifest` and by nothing else; see that module for why three separate
# hardcoded literals were replaced by one key each.
#
# `language_roots` — the directories that hold `language!` declarations. Both
# specification audits scan exactly these, and each proves its own scan is TOTAL for the
# repository (`language_declarations_cannot_hide_outside_the_scanned_roots`), so a
# declaration written outside a root fails loudly instead of silently escaping formal
# coverage.
#
# `proptest_corpus_dir` — where generated property tests persist counterexample seeds.
# It is the ONE path the `language!` macro resolves outside `target/`, because a corpus is
# an INPUT to the tests rather than a generated source: under `target/` it would be erased
# by `cargo clean` and the seeds would quietly stop being replayed.
[package.metadata.mettail]
language_roots = ["languages"]
proptest_corpus_dir = "languages/tests"

[[bin]]
name = "mettail"
path = "repl/src/main.rs"

[dependencies]
mettail-repl = { package = "repl", path = "repl" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }


[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MeTTaIL Contributors"]
license = "MIT"
repository = "https://github.com/F1R3FLY-io/mettail-rust"
homepage = "https://github.com/F1R3FLY-io/mettail-rust"

[workspace.dependencies]
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "visit-mut"] }
proc-macro-error = "1.0"
regex = "1.0"
rand = "0.8"

moniker = { version = "0.5", features = ["moniker-derive"] }
indexmap = "2.0"
pathmap = "0.2.2"

ascent_syntax_export = { path = "ascent_syntax_export" }
query = { path = "query" }

# ── f1r3node-rust integration (M-RHO) — cross-repo path deps, one-way only ───────
# MeTTaIL is the COMPILER, f1r3node-rust's Rho machine is the RUNTIME. The bridge
# crates (mettail-rho-{codegen,runtime,adapter}) depend ONE-WAY on these; f1r3node
# NEVER depends on mettail-rust (enforced by the host guard test
# `mettail_rust_is_not_a_cargo_dependency` + proven in
# formal/rocq/rho_bridge/theories/BridgeInertness.v). Sibling checkout at
# ../f1r3node-rust (publish=false crates → path deps). Toolchain note: f1r3node-rust
# pins nightly-2026-02-09; mettail-rust floats `nightly` + cranelift dev backend.
models = { path = "../f1r3node-rust/models" }
rholang = { path = "../f1r3node-rust/rholang" }
rho-pure-eval = { path = "../f1r3node-rust/rho-pure-eval" }
rspace_plus_plus = { path = "../f1r3node-rust/rspace++" }
crypto = { path = "../f1r3node-rust/crypto" }
tokio = { version = "1", features = ["full"] }

# ── rholang-parser override (TEMPORARY) — mirrors f1r3node-rust's root [patch] ────
# MeTTaIL has NO direct dependency on `rholang_parser`; it never parses Rholang text
# (it builds `rhoapi::Par` AST directly). The dep is purely transitive: the bridge
# crates use f1r3node-rust's `rholang` runtime crate, which depends on `rholang_parser`.
# f1r3node-rust's `rholang` is mid-migration onto the cost-accounting parser worktree
# (carries Proc::SignedTerm / TokenStack / Bind::Signed); its published pin
# (rholang/Cargo.toml rev=c163755) REMOVED those, so building `rholang` from THIS
# workspace needs the same git-worktree override f1r3node-rust uses. Remove this stanza
# once the cost-accounting work merges to the rholang-rs master branch.
[patch."https://github.com/F1R3FLY-io/rholang-rs"]
rholang-parser = { path = "../rholang-rs-cost-accounting-transpiler/rholang-parser" }

[profile.dev]
codegen-backend = "cranelift" # Fast compile, slower runtime (~2.7x vs LLVM)
debug = "line-tables-only"    # Saves debuginfo generation time

# `gxhash` (via pathmap → f1r3node-rust `models`, M-RHO integration) requires the
# `aes`+`sse2` target-feature cfg, which the cranelift backend does NOT set (it
# only enables cfgs for features cranelift supports), so it must build under LLVM.
# Scoped to gxhash so the rest of the workspace keeps the fast cranelift dev loop.
[profile.dev.package.gxhash]
codegen-backend = "llvm"

[profile.test.package.gxhash]
codegen-backend = "llvm"

# The language crate aggregates multi-megabyte generated parser, AST, display,
# and Dovetail lowering modules. In practice Cranelift is not the right dev/test
# backend for this shape of code: the 2026-06-02 nightly Cranelift backend has
# already ICE'd on this workspace, and focused Calculator test builds exceeded
# capped local validation envelopes while compiling this generated crate. Keep
# the rest of the workspace on the fast Cranelift dev loop, but compile the
# generated aggregation crate through LLVM for the profiles used by cargo test.
[profile.dev.package.languages]
codegen-backend = "llvm"

[profile.test.package.languages]
codegen-backend = "llvm"

[profile.release]
codegen-backend = "llvm"      # Full LLVM optimization for runtime performance
opt-level = 3

[profile.bench]
inherits = "release"          # Benchmarks use LLVM for accurate measurements
debug = "line-tables-only"    # Source-line attribution in perf profiles
