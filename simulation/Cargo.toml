[package]
name = "mettail-simulation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Simulation infrastructure for MeTTaIL: stochastic Petri nets, MDPs, Parikh automata, streaming automata, and new semirings"

[dependencies]
mettail-ast = { path = "../ast" }
mettail-runtime = { path = "../runtime" }
mettail-prattail = { path = "../prattail" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
rand = { workspace = true }
rand_distr = "0.4"
proptest = "1"

[dev-dependencies]
mettail-languages = { path = "../languages" }
quote = { workspace = true }
syn = { workspace = true }

# Required by `language!` macro expansion in example binaries.
# The generated code references these crates directly.
mettail-macros = { path = "../macros" }
moniker = { workspace = true }
indexmap = { workspace = true }
ascent = { workspace = true }
ascent-byods-rels = { workspace = true }
hashbrown = { version = "0.14", features = ["raw", "rayon"] }
rustc-hash = "2.0"

[[example]]
name = "demo_supply_chain"
path = "examples/demo_supply_chain.rs"
