[package]
name = "dovetail"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Substrate-agnostic GSLT reduction engine core: a generic-W weighted tree automaton over a runtime e-graph (DFTA) with exact lazy best-first enumeration (Huang-Chiang Alg.3, N-best/set-valued, no-miss). Weights order, never prune; removal only at semiring 0-bar; exact content keying."

# Dovetail is deliberately substrate-agnostic so it can be extracted as its own
# published crate later: NO dependency on the parser (mettail-prattail), the
# proc-macros (mettail-macros), the AST crates, f1r3node-rust, tokio, or RSpace.

[features]
default = []

[dependencies]
# The weight algebra (Semiring/StarSemiringRef, weight types, Newton-SCC closure)
# — the single source of truth, shared with prattail. dovetail stays
# substrate-agnostic: this is its ONLY workspace dependency.
rigail = { path = "../rigail" }
mettail-semantic-key = { path = "../semantic-key" }

[dev-dependencies]
proptest = "1"
rand = { workspace = true }
