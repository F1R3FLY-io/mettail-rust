4.67" y="129.1018">(parse_guards)</text></g><!--entity Slot--><g class="entity" data-qualified-name="Surf.Slot" data-source-line="20" id="ent0003"><rect fill="#BFDBFE" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="152.6915" x="342.65" y="85.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.9076" x="352.65" y="110.0339">?guard:Guard slot</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.6915" x="352.65" y="129.1018">(parse_term_param)</text></g><!--entity Where--><g class="entity" data-qualified-name="Surf.Where" data-source-line="21" id="ent0004"><rect fill="#BFDBFE" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="196.5253" x="917.74" y="85.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.5253" x="927.74" y="110.0339">where-clause sublanguage</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.2435" x="927.74" y="129.1018">(predicate_pratt.rs)</text></g><!--entity Logic--><g class="entity" data-qualified-name="Surf.Logic" data-source-line="22" id="ent0005"><rect fill="#BFDBFE" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="162.0434" x="529.98" y="85.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.0434" x="539.98" y="110.0339">logic { relation } block</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.4877" x="539.98" y="129.1018">(parse_logic)</text></g><!--entity Tier--><g class="entity" data-qualified-name="Surf.Tier" data-source-line="23" id="ent0006"><rect fill="#BFDBFE" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="156.3175" x="726.84" y="85.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="11.7599" x="736.84" y="110.0339">1.</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.1456" x="752.3519" y="110.0339">[tier(...)] directive</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.3175" x="736.84" y="129.1018">(parse_tier_directive)</text></g><!--entity GC--><g class="entity" data-qualified-name="Built.GC" data-source-line="28" id="ent0008"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="243.6771" x="31.16" y="273.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0977" x="41.16" y="298.7039">GuardConfig</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.6771" x="41.16" y="317.7718">(channels / theories / connectives)</text></g><!--entity TP--><g class="entity" data-qualified-name="Built.TP" data-source-line="29" id="ent0009"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="217.9312" x="310.03" y="273.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.5154" x="320.03" y="298.7039">TermParam::GuardBody</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.9312" x="320.03" y="317.7718">+ per-instance BehavioralPred</text></g><!--entity BP--><g class="entity" data-qualified-name="Built.BP" data-source-line="30" id="ent0010"><rect fill="#BBF7D0" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="209.4892" x="911.26" y="264.1979"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.7016" x="921.26" y="289.1639">BehavioralPred</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.4892" x="921.26" y="308.2318">(RelationQuery / Quantified /</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.0234" x="921.26" y="327.2997">And / Or / Not / Implies)</text></g><!--entity Rel--><g class="entity" data-qualified-name="Built.Rel" data-source-line="31" id="ent0011"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="135.4296" x="563.29" y="273.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.4296" x="573.29" y="298.7039">external relations</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.5257" x="573.29" y="317.7718">(LogicBlock)</text></g><!--entity TD--><g class="entity" data-qualified-name="Built.TD" data-source-line="32" id="ent0012"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="142.2055" x="733.9" y="273.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.9777" x="743.9" y="298.7039">TierDirective</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.2055" x="743.9" y="317.7718">(tier, bound, force)</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="42" id="ent0019"><path d="M1191.76,253.5379 L1191.76,352.068 A0,0 0 0 0 1191.76,352.068 L1622.2473,352.068 A0,0 0 0 0 1622.2473,352.068 L1622.2473,263.5379 L1612.2473,253.5379 L1308.99,253.5379 L1075.81,143.6879 L1300.99,253.5379 L1191.76,253.5379 A0,0 0 0 0 1191.76,253.5379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1612.2473,253.5379 L1612.2473,263.5379 L1622.2473,263.5379 L1612.2473,253.5379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.8253" x="1197.76" y="272.4349">The where-clause text is parsed by prattail's PredicateParser;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.2762" x="1197.76" y="290.1409">where is NOT a reserved keyword &#8212; it is a literal sitting before</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.0333" x="1197.76" y="307.847">the ?guard:Guard slot, which lowers to a GuardExpression parser</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.4873" x="1197.76" y="325.553">item and switches into the predicate sublanguage. Any literal could</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.0371" x="1197.76" y="343.259">precede the slot.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="50" id="ent0022"><path d="M861.36,420.4079 L861.36,501.232 L1450.6424,501.232 L1450.6424,430.4079 L1440.6424,420.4079 L861.36,420.4079" fill="#FEF3C7" style="stroke:#181818;stroke-width:0.5;"/><path d="M1440.6424,420.4079 L1440.6424,430.4079 L1450.6424,430.4079 L1440.6424,420.4079" fill="#FEF3C7" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="568.2824" x="867.36" y="439.3049">Beyond these authorable surfaces, the staged-analysis substrate algebras are now wired into</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="458.9264" x="867.36" y="457.0109">the live pipeline as default-off lints (RT03 / RT07 / LP01 / HM01, the N06-ISO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443.4549" x="867.36" y="474.717">bisimulation supersede, the letprop&#8594;PATA decision) &#8212; see the substrate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="476.7624" x="867.36" y="492.423">wiring-status map. Wired is not writable: those still have no language! surface.</text></g><!--link G to GC--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" data-source-line="35" id="lnk13"><path d="M231.88,143.4879 C214.34,178.6679 186.8605,233.843 169.3305,269.013" fill="none" id="G-to-GC" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="167.1,273.4879,174.6948,267.2174,169.3305,269.013,167.5349,263.6487,167.1,273.4879" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.959" x="216.92" y="190.0949">builds</text></g><!--link Slot to TP--><g class="link" data-entity-1="ent0003" data-entity-2="ent0009" data-link-type="dependency" data-source-line="36" id="lnk14"><path d="M419,143.4879 C419,178.6679 419,233.3179 419,268.4879" fill="none" id="Slot-to-TP" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="419,273.4879,423,264.4879,419,268.4879,415,264.4879,419,273.4879" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.959" x="420" y="190.0949">builds</text></g><!--link Where to BP--><g class="link" data-entity-1="ent0004" data-entity-2="ent0010" data-link-type="dependency" data-source-line="37" id="lnk15"><path d="M1016,143.4879 C1016,175.6079 1016,223.1279 1016,258.7879" fill="none" id="Where-to-BP" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="1016,263.7879,1020,254.7879,1016,258.7879,1012,254.7879,1016,263.7879" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.959" x="1017" y="190.0949">builds</text></g><!--link Logic to Rel--><g class="link" data-entity-1="ent0005" data-entity-2="ent0011" data-link-type="dependency" data-source-line="38" id="lnk16"><path d="M614.04,143.4879 C617.81,178.6679 623.6671,233.3464 627.4371,268.5164" fill="none" id="Logic-to-Rel" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="627.97,273.4879,630.988,264.1129,627.4371,268.5164,623.0335,264.9655,627.97,273.4879" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.959" x="620.21" y="190.0949">builds</text></g><!--link Tier to TD--><g class="link" data-entity-1="ent0006" data-entity-2="ent0012" data-link-type="dependency" data-source-line="39" id="lnk17"><path d="M805,143.4879 C805,178.6679 805,233.3179 805,268.4879" fill="none" id="Tier-to-TD" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="805,273.4879,809,264.4879,805,268.4879,801,264.4879,805,273.4879" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.959" x="806" y="190.0949">builds</text></g><!--link Built to GMN21--><g class="link" data-entity-1="ent0007" data-entity-2="ent0022" data-link-type="association" data-source-line="50" id="lnk23"><path d="M1156,365.9543 C1156,366.1498 1156,366.3454 1156,366.5412 C1156,367.3242 1156,368.1094 1156,368.8964 C1156,370.4704 1156,372.0516 1156,373.6374 C1156,376.8089 1156,379.9987 1156,383.1854 C1156,395.9323 1156,408.6304 1156,419.9179" fill="none" id="Built-GMN21" style="stroke:#374151;stroke-width:1.3;stroke-dasharray:7,7;"/></g><g class="legend" data-source-line="56"><rect fill="none" height="90.2717" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="461.7503" x="1156.497" y="522.232"/><text fill="#000000" font-family="sans-serif" font-size="14" f