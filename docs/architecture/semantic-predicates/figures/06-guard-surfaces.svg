mily="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.0234" x="913.26" y="311.3097">And / Or / Not / Implies)</text></g><!--entity Rel--><g class="entity" data-qualified-name="Built.Rel" data-source-line="31" id="ent0011"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="135.4296" x="555.29" y="257.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.4296" x="565.29" y="282.7039">external relations</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.5257" x="565.29" y="301.7718">(LogicBlock)</text></g><!--entity TD--><g class="entity" data-qualified-name="Built.TD" data-source-line="32" id="ent0012"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="142.2055" x="725.9" y="257.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.9777" x="735.9" y="282.7039">TierDirective</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.2055" x="735.9" y="301.7718">(tier, bound, force)</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="42" id="ent0019"><path d="M1147.68,237.5379 L1147.68,336.068 A0,0 0 0 0 1147.68,336.068 L1580.3253,336.068 A0,0 0 0 0 1580.3253,336.068 L1580.3253,247.5379 L1570.3253,237.5379 L1268.35,237.5379 L1073.41,143.6979 L1260.35,237.5379 L1147.68,237.5379 A0,0 0 0 0 1147.68,237.5379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1570.3253,237.5379 L1570.3253,247.5379 L1580.3253,247.5379 L1570.3253,237.5379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.1312" x="1153.68" y="256.4349">The `where`-clause text is parsed by prattail's PredicateParser;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.5822" x="1153.68" y="274.1409">`where` is NOT a reserved keyword &#8212; it is a literal sitting before</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.6453" x="1153.68" y="291.847">the `?guard:Guard` slot, which lowers to a `GuardExpression` parser</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.4873" x="1153.68" y="309.553">item and switches into the predicate sublanguage. Any literal could</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.0371" x="1153.68" y="327.259">precede the slot.</text></g><!--link G to GC--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" data-source-line="35" id="lnk13"><path d="M214.94,143.6979 C199.39,175.2979 176.6876,221.4216 161.1776,252.9416" fill="none" id="G-to-GC" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="158.97,257.4279,166.5326,251.1187,161.1776,252.9416,159.3546,247.5866,158.97,257.4279" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.959" x="200.43" y="190.1049">builds</text></g><!--link Slot to TP--><g class="link" data-entity-1="ent0003" data-entity-2="ent0009" data-link-type="dependency" data-source-line="36" id="lnk14"><path d="M406.84,143.6979 C407.76,175.2979 409.1041,220.91 410.0241,252.43" fill="none" id="Slot-to-TP" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="410.17,257.4279,413.9057,248.315,410.0241,252.43,405.9091,248.5484,410.17,257.4279" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.959" x="409.