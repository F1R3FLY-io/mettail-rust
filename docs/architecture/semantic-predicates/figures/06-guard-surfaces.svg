gthAdjust="spacing" textLength="189.4892" x="913.26" y="292.2418">(RelationQuery / Quantified /</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.0234" x="913.26" y="311.3097">And / Or / Not / Implies)</text></g><!--entity Rel--><g class="entity" data-qualified-name="Built.Rel" data-source-line="31" id="ent0011"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="135.4296" x="555.29" y="257.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.4296" x="565.29" y="282.7039">external relations</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.5257" x="565.29" y="301.7718">(LogicBlock)</text></g><!--entity TD--><g class="entity" data-qualified-name="Built.TD" data-source-line="32" id="ent0012"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="142.2055" x="725.9" y="257.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.9777" x="735.9" y="282.7039">TierDirective</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.2055" x="735.9" y="301.7718">(tier, bound, force)</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="42" id="ent0019"><path d="M1147.76,237.5379 L1147.76,336.068 A0,0 0 0 0 1147.76,336.068 L1578.2473,336.068 A0,0 0 0 0 1578.2473,336.068 L1578.2473,247.5379 L1568.2473,237.5379 L1265.64,237.5379 L1067.42,143.6979 L1257.64,237.5379 L1147.76,237.5379 A0,0 0 0 0 1147.76,237.5379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1568.2473,237.5379 L1568.2473,247.5379 L1578.2473,247.5379 L1568.2473,237.5379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLengt