<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="507px" preserveAspectRatio="none" style="width:680px;height:507px;background:#FEFEFE;" version="1.1" viewBox="0 0 680 507" width="680px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FEFEFE" height="507" style="stroke:none;stroke-width:1;" width="680" x="0" y="0"/><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="479.4421" x="96.7935" y="24.9659">SFT transduction: input-predicate / output-term edges (case_fold_sft)</text></g><g class="entity" data-qualified-name="q0" data-source-line="15" id="ent0001"><rect fill="#EDE9FE" height="58.1358" rx="12.5" ry="12.5" style="stroke:#1F2937;stroke-width:0.5;" width="83.7278" x="279.76" y="191.5279"/><line style="stroke:#1F2937;stroke-width:0.5;" x1="279.76" x2="363.4878" y1="239.6638" y2="239.6638"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="16.6179" x="289.76" y="211.4939">q0</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.7278" x="289.76" y="230.5618">accepting</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="13" id="ent0002"><ellipse cx="321.62" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="19" id="ent0006"><ellipse cx="321.62" cy="386.1279" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="321.62" cy="386.1279" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN8" data-source-line="22" id="ent0009"><path d="M6,127.0679 L6,314.1281 A0,0 0 0 0 6,314.1281 L245.2442,314.1281 A0,0 0 0 0 245.2442,314.1281 L245.2442,224.5979 L279.37,220.5979 L245.2442,216.5979 L245.2442,137.0679 L235.2442,127.0679 L6,127.0679 A0,0 0 0 0 6,127.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M235.2442,127.0679 L235.2442,137.0679 L245.2442,137.0679 L235.2442,127.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.8962" x="12" y="145.9649">Each edge carries a guard AND an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.2142" x="12" y="163.6709">output function: the guard &#966;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.0722" x="12" y="181.377">decides WHETHER the edge fires;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.5662" x="12" y="199.083">the output function f decides</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.8612" x="12" y="216.789">WHAT is emitted when it does.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.2442" x="12" y="234.495">The two guards are complementary</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.9643" x="12" y="252.201">([A-Z] &#8743; &#172;[A-Z] is unsatisfiable),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3241" x="12" y="269.907">so exactly one fires per element</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.0117" x="12" y="287.6131">&#8658; the transducer is functional</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.3781" x="12" y="305.3191">(single-valued).</text></g><!--link *start* to q0--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" data-link-type="dependency" data-source-line="13" id="lnk3"><path d="M321.62,66.2679 C321.62,89.9779 321.62,148.8779 321.62,186.2779" fill="none" id="*start*-to-q0" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="321.62,191.2779,325.62,182.2779,321.62,186.2779,317.62,182.2779,321.62,191.2779" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link q0 to q0--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" data-link-type="dependency" data-source-line="17" id="lnk4"><path d="M363.92,209.1279 C382.5,208.1179 398.49,211.9379 398.49,220.5979 C398.49,229.2579 387.4926,233.3493 368.9126,232.3393" fill="none" id="q0-to-q0" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="363.92,232.0679,372.6896,236.5505,368.9126,232.3393,373.1238,228.5623,363.92,232.0679" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.2231" x="404.49" y="216.9949">[A-Z] / emit lowercase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.6997" x="425.2517" y="234.7009">(Map c &#8614; c+32)</text></g><!--link q0 to q0--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" data-link-type="dependency" data-source-line="18" id="lnk5"><path d="M363.89,204.6479 C430.72,191.0879 542.49,196.4079 542.49,220.5979 C542.49,244.7879 435.6201,251.1022 368.7901,237.5422" fill="none" id="q0-to-q0-1" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="363.89,236.5479,371.9149,242.2577,368.7901,237.5422,373.5057,234.4175,363.89,236.5479" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.5391" x="548.49" y="216.9949">&#172;[A-Z] / emit input</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.9381" x="576.2905" y="234.7009">(Identity)</text></g><!--link q0 to *end*--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" data-link-type="dependency" data-source-line="19" id="lnk7"><path d="M321.62,250.0779 C321.62,287.2379 321.62,345.3779 321.62,369.9379" fill="none" id="q0-to-*end*" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="321.62,374.9379,325.62,365.9379,321.62,369.9379,317.62,365.9379,321.62,374.9379" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="34"><rect fill="none" height="71.2038" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="332.0128" x="170.5082" y="417.1279"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="36.9179" x="179.1482" y="439.0939">Color</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="57.5538" x="223.346" y="439.0939">Element</text><rect fill="#EDE9FE" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="175.5082" y="443.1958"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="175.5082" y="458.1618">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="204.2872" x="223.346" y="458.1618">symbolic transducer (SFT) state</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="27.4539" x="179.1482" y="477.2297">&#966; / f</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.5349" x="223.346" y="477.2297">input guard / output function on an edge</text><line style="stroke:#000000;stroke-width:1;" x1="175.5082" x2="497.5209" y1="42