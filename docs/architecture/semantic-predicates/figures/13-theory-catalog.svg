<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="594px" preserveAspectRatio="none" style="width:822px;height:594px;background:#FEFEFE;" version="1.1" viewBox="0 0 822 594" width="822px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FEFEFE" height="594" style="stroke:none;stroke-width:1;" width="822" x="0" y="0"/><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="448.6143" x="183.3456" y="24.9659">The shipped decidable theories, lifted to EBAs via TheoryAlgebra</text></g><!--entity Presburger--><g class="entity" data-qualified-name="Presburger" data-source-line="22" id="ent0001"><rect fill="#DCFCE7" height="96.2717" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="253.1551" x="7" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.9095" x="17" y="72.0339">PresburgerTheory</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.0118" x="17" y="91.1018">Store: linear &#8804; atoms + NFA</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="233.1551" x="17" y="110.1697">NFA non-emptiness (Bartzis-Bultan)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.9556" x="17" y="129.2376">(Proposition 1)</text></g><!--entity Unification--><g class="entity" data-qualified-name="Unification" data-source-line="24" id="ent0002"><rect fill="#DCFCE7" height="96.2717" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="243.5651" x="294.79" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.0115" x="304.79" y="72.0339">UnificationTheory</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.1594" x="304.79" y="91.1018">Store: solved substitution</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.5651" x="304.79" y="110.1697">Martelli-Montanari + occurs-check</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.5273" x="304.79" y="129.2376">witness = mgu (Theorem 2)</text></g><!--entity Lattice--><g class="entity" data-qualified-name="Lattice" data-source-line="26" id="ent0003"><rect fill="#FEF3C7" height="96.2717" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="225.8552" x="573.65" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.2496" x="583.65" y="72.0339">LatticeTheory</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="205.8552" x="583.65" y="91.1018">Store: edges + Warshall closure</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.1493" x="583.65" y="110.1697">finite subtype order (Prop 3)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.7273" x="583.65" y="129.2376">preorder; partial join/meet</text></g><!--entity Bridge--><g class="entity" data-qualified-name="Bridge" data-source-line="29" id="ent0004"><rect fill="#E0E7FF" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="159.1595" x="337" y="204.3379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.8335" x="347" y="229.3039">TheoryAlgebra&lt;T&gt;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.1595" x="347" y="248.3718">the bridge (section 2)</text></g><!--entity BA--><g class="entity" data-qualified-name="BA" data-source-line="31" i