<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="504px" preserveAspectRatio="none" style="width:741px;height:504px;background:#FEFEFE;" version="1.1" viewBox="0 0 741 504" width="741px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FEFEFE" height="504" style="stroke:none;stroke-width:1;" width="741" x="0" y="0"/><g class="title" data-source-line="10"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="496.3545" x="118.8504" y="24.9659">A non-Boolean Heyting algebra: the chain `&#8869; &lt; M &lt; &#8868;` where `&#172;&#172;M &#8800; M`</text></g><g class="entity" data-qualified-name="Top" data-source-line="15" id="ent0001"><rect fill="#DCFCE7" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="64.0092" x="282.63" y="342.3979"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.0092" x="289.63" y="359.3639">&#8868;  (top)</text><line style="stroke:#1F2937;stroke-width:0.5;" x1="283.63" x2="345.6392" y1="365.4658" y2="365.4658"/></g><g class="entity" data-qualified-name="Mid" data-source-line="16" id="ent0002"><rect fill="#FEF3C7" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="87.8077" x="270.73" y="188.7179"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.8077" x="277.73" y="205.6839">M  (middle)</text><line style="stroke:#1F2937;stroke-width:0.5;" x1="271.73" x2="357.5377" y1="211.7858" y2="211.7858"/></g><g class="entity" data-qualified-name="Bot" data-source-line="17" id="ent0003"><rect fill="#DCFCE7" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="90.6231" x="269.32" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.6231" x="276.32" y="64.0339">&#8869;  (bottom)</text><line style="stroke:#1F2937;stroke-width:0.5;" x1="270.32" x2="358.9431" y1="70.1358" y2="70.1358"/></g><g class="entity" data-qualified-name="GMN6" data-source-line="24" id="ent0007"><path d="M393.21,146.1379 L393.21,204.2479 L358.66,208.2479 L393.21,212.2479 L393.21,270.374 A0,0 0 0 0 393.21,270.374 L726.0552,270.374 A0,0 0 0 0 726.0552,270.374 L726.0552,156.1379 L716.0552,146.1379 L393.21,146.1379 A0,0 0 0 0 393.21,146.1379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M716.0552,146.1379 L716.0552,156.1379 L726.0552,156.1379 L716.0552,146.1379" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="254.7222" x="399.21" y="165.0349">M is the non-regular boundary element</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.2432" x="399.21" y="182.7409">(the `Sat3::DontKnow` avatar)</text><line style="stroke:#181818;stroke-width:1;" x1="394.21" x2="725.0552" y1="186.5499" y2="186.5499"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.398" x="399.21" y="204.447">`&#172;M = (M &#8594; &#8869;) = &#8869;`   (since `M &#8816; &#8869;`)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.8452" x="399.21" y="222.153">`&#172;&#172;M = &#172;&#8869; = &#8868; &#8800; M`   (double negation overshoots)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.2881" x="399.21" y="239.859">excluded middle fails:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.1494" x="399.21" y="257.565">`M &#8744; &#172;M = M &#8744; &#8869; = M &#8800; &#8868;`</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="34" id="ent0010"><path d="M6,330.3679 L6,393.486 A0,0 0 0 0 6,393.486 L247.2722,393.486 A0,0 0 0 0 247.2722,393.486 L247.2722,365.9279 L282.35,361.9279 L247.2722,357.9279 L247.2722,340.3679 L237.2722,330.3679 L6,330.3679 A0,0 0 0 0 6,330.3679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M237.2722,330.3679 L237.2722,340.3679 L247.2722,340.3679 L237.2722,330.3679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.7165" x="12" y="349.2649">`&#8869;` and `&#8868;` are</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="47.71" x="106.0965" y="349.2649">regular</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.709" x="12" y="366.9709">(`&#172;&#172;&#8869; = &#8869;`, `&#172;&#172;&#8868; = &#8868;`)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.2722" x="12" y="384.677">&#8212; classical reasoning is sound here.</text></g><!--link Bot to Mid--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="association" data-source-line="20" id="lnk4"><path codeLine="20" d="M314.64,86.4379 C314.64,113.0879 314.64,161.5379 314.64,188.2679" fill="none" id="Bot-Mid" style="stroke:#374151;stroke-width:1.3;"/></g><!--link Mid to Top--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" data-link-type="association" data-source-line="21" id="lnk5"><path codeLine="21" d="M314.64,228.1579 C314.64,257.3779 314.64,313.1879 314.64,342.2679" fill="none" id="Mid-Top" style="stroke:#374151;stroke-width:1.3;"/></g><g class="legend" data-source-line="39"><rect fill="none" height="71.2038" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="365.7806" x="356.2746" y="414.486"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="36.9179" x="364.9146" y="436.4519">Color</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="61.1798" x="409.1124" y="436.4519">Meaning</text><rect fill="#DCFCE7" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="361.2746" y="440.5539"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="361.2746" y="455.5198">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="304.3028" x="409.1124" y="455.5198">regular element (`&#172;&#172;a = a`): recovered-classical</text><rect fill="#FEF3C7" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="361.2746" y="459.6218"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="361.2746" y="474.5877">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="299.3748" x="409.1124" y="474.5877">non-regular boundary element (Heyting-only)</text><line style="stroke:#000000;stroke-width:1;" x1="361.2746" x2="717.0552" y1="421.486" y2="421.486"/><line style="stroke:#000000;stroke-width:1;" x1="361.2746" x2="717.0552" y1="440.5539" y2="440.5539"/><line style="stroke:#000000;stroke-width:1;" x1="361.2746" x2="717.0552" y1="459.6218" y2="459.6218"/><line style="stroke:#000000;stroke-width:1;" x1="361.2746" x2="717.0552" y1="478.6897" y2="478.6897"/><line style="stroke:#000000;stroke-width:1;" x1="361.2746" x2="361.2746" y1="421.486" y2="478.6897"/><line style="stroke:#000000;stroke-width:1;" x1="405.4724" x2="405.4724" y1="421.486" y2="478.6897"/><line style="stroke:#000000;stroke-width:1;" x1="717.0552" x2="717.0552" y1="421.486" y2="478.6897"/></g><?plantuml-src VLF1RXCn4BtxAqRjWMpKZPG658XQf3PjL0cjE90FM6VjxYvrxCXs6Yg2r1EYFQ9-08TKuj03tz1FoPSmOszAg129artRCyzltZoxYrhFkELJcF3YehHchiNGA6DXTtHAN-QU8bp5XLdKkeHphfp