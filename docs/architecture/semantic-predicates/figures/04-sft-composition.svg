gthAdjust="spacing" textLength="68.4862" x="208.7021" y="86.1018">T&#8321; : A &#8594; B*</text></g><g class="participant participant-tail" data-entity-uid="part2" data-qualified-name="T1" data-source-line="15" id="part2-tail"><rect fill="#EDE9FE" height="33.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="82.4862" x="201.7021" y="356.2639"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.4862" x="208.7021" y="378.2299">T&#8321; : A &#8594; B*</text></g><g class="participant participant-head" data-entity-uid="part3" data-qualified-name="T2" data-source-line="16" id="part3-head"><rect fill="#EDE9FE" height="33.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="82.3882" x="328.6802" y="64.1358"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.3882" x="335.6802" y="86.1018">T&#8322; : B &#8594; C*</text></g><g class="participant participant-tail" data-entity-uid="part3" data-qualified-name="T2" data-source-line="16" id="part3-tail"><rect fill="#EDE9FE" height="33.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="82.3882" x="328.6802" y="356.2639"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.3882" x="335.6802" y="378.2299">T&#8322; : B &#8594; C*</text></g><g class="participant participant-head" data-entity-uid="part4" data-qualified-name="OUT" data-source-line="17" id="part4-head"><rect fill="#FCE7F3" height="52.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="60.9558" x="421.0684" y="45.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.9558" x="428.0684" y="67.0339">Output</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="24.9619" x="439.0654" y="86.1018">(C*)</text></g><g class="participant participant-tail" data-entity-uid="part4" data-qualified-name="OUT" data-source-line="17" id="part4-tail"><rect fill="#FCE7F3" height="52.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="60.9558" x="421.0684" y="356.2639"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.9558" x="428.0684" y="378.2299">Output</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="24.9619" x="439.0654" y="397.2978">(C*)</text></g><g><title>T. . A . B.</title><rect fill="#FFFFFF" height="63.412" style="stroke:#181818;stroke-width:1;" width="10" x="237.9452" y="131.9098"/></g><g><title>T. . B . C.</title><rect fill="#FFFFFF" height="31.706" style="stroke:#181818;stroke-width:1;" width="10" x="364.8743" y="163.6158"/></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="19" id="msg1"><polygon fill="#374151" points="225.9452,127.9098,235.9452,131.9098,225.9452,135.9098,229.9452,131.9098" style="stroke:#374151;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#374151;stroke-width:1.3;" x1="145.2612" x2="231.9452" y1="131.9098" y2="131.9098"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.6841" x="152.2612" y="126.1008">word over A</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="21" id="msg2"><polygon fill="#374151" points="352.8743,159.6158,362.8743,163.6158,352.8743,167.6158,356.8743,163.6158" style="stroke:#374151;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#374151;stroke-width:1.3;" x1="247.9452" x2="358.8743" y1="163.6158" y2="163.6158"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.9291" x="254.9452" y="157.8068">intermediate B*</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" data-source-line="23" id="msg3"><polygon fill="#374151" points="439.5463,191.3218,449.5463,195.3218,439.5463,199.3218,443.5463,195.3218" style="stroke:#374151;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#374151;stroke-width:1.3;" x1="369.8743" x2="445.5463" y1="195.3218" y2="195.3218"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="15.379" x="376.8743" y="189.5128">C*</text></g><path d="M114.4042,208.3218 L114.4042,341.3218 L498.4042,341.3218 L498.4042,218.3218 L488.4042,208.3218 L114.4042,208.3218" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M488.4042,208.3218 L488.4042,218.3218 L498.4042,218.3218 L488.4042,208.3218" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.389" x="120.4042" y="227.2188">compose::&lt;C&gt; builds the product T&#8321; &#8728; T&#8322; &#8212; ONE transducer,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.0993" x="120.4042" y="244.9248">not a runtime chain. The middle algebra B must match</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.9363" x="120.4042" y="262.6308">(output of T&#8321; = input of T&#8322;), which is exactly why</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.5503" x="120.4042" y="280.3369">composability requires the middle algebra to agree.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.2202" x="120.4042" y="298.0429">Composition preserves functionality</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.2463" x="120.4042" y="315.7489">(compose_preserves_functional, SftFunctionality.v):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.4133" x="120.4042" y="333.4549">chaining single-valued transducers stays single-valued.</text><g class="legend" data-source-line="37"><rect fill="none" height="90.2717" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="297.5729" x="157.3123" y="422.3997"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="36.9179" x="165.9523" y="444.3657">Color</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="39.3819" x="210.1501" y="444.3657">Stage</text><rect fill="#DBEAFE" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="162.3123" y="448.4677"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="162.3123" y="463.4336">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.4294" x="210.1501" y="463.4336">input word over algebra A</text><rect fill="#EDE9FE" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="162.3123" y="467.5356"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="162.3123" y="482.5015">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.8432" x="210.1501" y="482.5015">symbolic transducer stage (SFT)</text><rect fill="#FCE7F3" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="162.3123" y="486.6035"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="162.3123" y="501.5694">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="236.0951" x="210.1501" y="501.5694">emitted output word over algebra C</text><line style="stroke:#000000;stroke-width:1;" x1="162.3123" x2="449.8852" y1="429.3997" y2="429.3997"/><line style="st