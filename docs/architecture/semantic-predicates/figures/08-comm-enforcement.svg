="39" id="msg8"><line style="stroke:#374151;stroke-width:1.3;" x1="246.4901" x2="288.4901" y1="551.9156" y2="551.9156"/><line style="stroke:#374151;stroke-width:1.3;" x1="288.4901" x2="288.4901" y1="551.9156" y2="564.9156"/><line style="stroke:#374151;stroke-width:1.3;" x1="247.4901" x2="288.4901" y1="564.9156" y2="564.9156"/><polygon fill="#374151" points="257.4901,560.9156,247.4901,564.9156,257.4901,568.9156,253.4901,564.9156" style="stroke:#374151;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.4182" x="253.4901" y="528.4006">REST &#8212; leave datum, no consume,</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.3362" x="253.4901" y="546.1066">no emit (guard atomicity)</text></g><path d="M136,584.9156 L136,664.9156 L590,664.9156 L590,594.9156 L580,584.9156 L136,584.9156" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M580,584.9156 L580,594.9156 L590,594.9156 L580,584.9156" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.9564" x="142" y="603.8126">The EBA/SFT is NOT re-evaluated at run time &#8212; it was classified</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.5843" x="142" y="621.5186">at compile time and the flip gate already admitted it. The host</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.2643" x="142" y="639.2246">gates the COMM; the algebra never runs in the hot path. A failed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.6284" x="142" y="656.9307">guard consumes nothing and emits nothing (failed_guard_no_commit).</text><g class="legend" data-source-line="50"><rect fill="none" height="71