roke:#1F2937;stroke-width:0.5;" x1="301.0395" x2="384.7673" y1="542.9838" y2="542.9838"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="16.6179" x="311.0395" y="514.8139">q2</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.7278" x="311.0395" y="533.8818">accepting</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="13" id="ent0004"><ellipse cx="342.8995" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="22" id="ent0009"><ellipse cx="342.8995" cy="624.9879" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="342.8995" cy="624.9879" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" data-source-line="25" id="ent0012"><path d="M46.4695,264.2079 L46.4695,415.856 A0,0 0 0 0 46.4695,415.856 L283.3348,415.856 A0,0 0 0 0 283.3348,415.856 L283.3348,344.0279 L317.5095,340.0279 L283.3348,336.0279 L283.3348,274.2079 L273.3348,264.2079 L46.4695,264.2079 A0,0 0 0 0 46.4695,264.2079" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M273.3348,264.2079 L273.3348,274.2079 L283.3348,274.2079 L273.3348,264.2079" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.3614" x="52.4695" y="283.1049">The edge fires when e &#8872; &#966; &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.9931" x="52.4695" y="300.8109">the EBA evaluate(&#966;, e) oracle</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.8652" x="52.4695" y="318.517">answers the membership question,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.3011" x="52.4695" y="336.223">not a symbol table. One</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4532" x="52.4695" y="353.929">predicate-guarded edge stands in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.5372" x="52.4695" y="371.635">for every concrete symbol that</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.6632" x="52.4695" y="389.341">satisfies its guard, so the alphabet</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.7722" x="52.4695" y="407.047">&#8484; stays finite in the machine.</text></g><!--link *start* to q0--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" data-link-type="dependency" data-source-line="13" id="lnk5"><path d="M342.8995,66.4679 C342.8995,80.1779 342.8995,101.2379 342.8995,121.5779" fill="none" id="*start*-to-q0" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="342.8995,126.5779,346.8995,117.5779,342.8995,121.5779,338.8995,117.5779,342.8995,126.5779" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link q0 to q1--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="19" id="lnk6"><path d="M342.8995,185.5579 C342.8995,221.0279 342.8995,276.0879 342.8995,309.5879" fill="none" id="q0-to-q1" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="342.8995,314.5879,346.8995,305.5879,342.8995,309.5879,338.8995,305.5879,342.8995,314.5879" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="37.063" x="343.8995" y="230.1049">[x &gt; 0]</text></g><!--link q1 to q2--><g class="link" data