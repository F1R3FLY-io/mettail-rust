<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="959px" preserveAspectRatio="none" style="width:697px;height:959px;background:#FEFEFE;" version="1.1" viewBox="0 0 697 959" width="697px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FEFEFE" height="959" style="stroke:none;stroke-width:1;" width="697" x="0" y="0"/><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="517.7181" x="86.3366" y="24.9659">Layered dispatch: classify a message once, never evaluate every predicate</text></g><!--entity MSG--><g class="entity" data-qualified-name="MSG" data-source-line="12" id="ent0001"><rect fill="#FFFFFF" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="247.3451" x="40.85" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.3451" x="50.85" y="72.0339">incoming message m on channel c</text></g><!--entity L0--><g class="entity" data-qualified-name="L0" data-source-line="14" id="ent0002"><rect fill="#E5E7EB" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="277.431" x="25.81" y="147.1379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.2115" x="35.81" y="172.1039">L0  CHANNEL HASH</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="257.431" x="35.81" y="191.1718">RSpace routes by channel / channel-set</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="222.9631" x="35.81" y="210.2397">free, native &#8212; only c's receiver set</text></g><!--entity L1--><g class="entity" data-qualified-name="L1" data-source-line="15" id="ent0003"><rect fill="#DBEAFE" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="305.9209" x="11.56" y="303.3379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.1814" x="21.56" y="328.3039">L1  STRUCTURAL MATCH</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="285.9209" x="21.56" y="347.3718">RSpace spatial pattern (folded guard prefix)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.2952" x="21.56" y="366.4397">free &#8212; shrinks the candidate set</text></g><!--entity L2--><g class="entity" data-qualified-name="L2" data-source-line="16" id="ent0004"><rect fill="#FEF3C7" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="298.557" x="15.25" y="459.5379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.9852" x="25.25" y="484.5039">L2  MINTERM DISPATCH TABLE</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="278.557" x="25.25" y="503.5718">compute_minterms partitions the domain;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272.187" x="25.25" y="522.6397">classify m once  -&gt;  accepting-contract set</text></g><!--entity L3--><g class="entity" data-qualified-name="L3" data-source-line="17" id="ent0005"><rect fill="#FEE2E2" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="315.0488" x="7" y="615.7479"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.6213" x="17" y="640.7139">L3  RESIDUAL VALIDATION</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="247.155" x="17" y="659.7818">T3/T4 only (halts/safe, SMT, bounded)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="295.0488" x="17" y="678.8497">native-join handler at the check_commit veto</text></g><!--entity OUT--><g class="entity" data-qualified-name="OUT" data-source-line="19" id="ent0006"><rect fill="#DCFCE7" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="197.6173" x="65.72" y="771.9479"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.6173" x="75.72" y="796.9139">compatible contracts for m</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="28" id="ent0013"><path d="M348.65,466.5879 L348.65,494.1479 L313.97,498.1479 L348.65,502.1479 L348.65,529.706 A0,0 0 0 0 348.65,529.706 L682.3913,529.706 A0,0 0 0 0 682.3913,529.706 L682.3913,476.5879 L672.3913,466.5879 L348.65,466.5879 A0,0 0 0 0 348.65,466.5879" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M672.3913,466.5879 L672.3913,476.5879 L682.3913,476.5879 L672.3913,466.5879" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.3143" x="354.65" y="485.4849">O(M&#183;N&#183;eval)  -&gt;  O(N_distinct&#183;eval) + lookup;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.7413" x="354.65" y="503.1909">a decision-DAG / BDD over atoms is sub-linear in N.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.7502" x="354.65" y="520.897">Compile-time-built for T1/T2 non-Z3 EBA guards.</text></g><!--link MSG to L0--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="21" id="lnk7"><path d="M164.52,86.4179 C164.52,102.7179 164.52,121.7879 164.52,142.0379" fill="none" id="MSG-to-L0" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="164.52,147.0379,168.52,138.0379,164.52,142.0379,160.52,138.0379,164.52,147.0379" style="stroke:#