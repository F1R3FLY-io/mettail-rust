<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="870px" preserveAspectRatio="none" style="width:1039px;height:870px;background:#FEFEFE;" version="1.1" viewBox="0 0 1039 870" width="1039px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FEFEFE" height="870" style="stroke:none;stroke-width:1;" width="1039" x="0" y="0"/><g class="title" data-source-line="18"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="581.1798" x="225.6212" y="24.9659">Concretizing a process as an LTS, so a &#956;-calculus predicate can be decided against it</text></g><!--entity T--><g class="entity" data-qualified-name="T" data-source-line="26" id="ent0001"><rect fill="#DBEAFE" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="171.0594" x="535.44" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.5396" x="545.44" y="72.0339">a process term t</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.0594" x="545.44" y="91.1018">(the thing to predicate)</text></g><!--entity HT--><g class="entity" data-qualified-name="HT" data-source-line="27" id="ent0002"><rect fill="#CCFBF1" height="87.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="284.7891" x="478.58" y="184.1979"/><rect fill="#CCFBF1" height="10" style="stroke:#1F2937;stroke-width:0.5;" width="15" x="743.3691" y="189.1979"/><rect fill="#CCFBF1" height="2" style="stroke:#1F2937;stroke-width:0.5;" width="4" x="741.3691" y="191.1979"/><rect fill="#CCFBF1" height="2" style="stroke:#1F2937;stroke-width:0.5;" width="4" x="741.3691" y="195.1979"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.1558" x="493.58" y="219.1639">HostTerm</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.7891" x="493.58" y="238.2318">successors(t): one-step labeled edges</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.9173" x="493.58" y="257.2997">label(t): atomic proposition</text></g><!--entity BL--><g class="entity" data-qualified-name="BL" data-source-line="28" id="ent0003"><rect fill="#CCFBF1" height="87.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="297.6815" x="472.13" y="350.3979"/><rect fill="#CCFBF1" height="10" style="stroke:#1F2937;stroke-width:0.5;" width="15" x="749.8115" y="355.3979"/><rect fill="#CCFBF1" height="2" style="stroke:#1F2937;stroke-width:0.5;" width="4" x="747.8115" y="357.3979"/><rect fill="#CCFBF1" height="2" style="stroke:#1F2937;stroke-width:0.5;" width="4" x="747.8115" y="361.3979"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.6195" x="487.13" y="385.3639">build_lts: BFS from t</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="257.6815" x="487.13" y="404.4318">the complete finite reachable LTS (S, &#8594;)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.9153" x="487.13" y="423.4997">until the frontier is empty</text></g><!--entity DN--><g class="entity" data-qualified-name="DN" data-source-line="29" id="ent0004"><rect fill="#FEF3C7" height="68.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="246.1912" x="309.88" y="516.6079"/><rect fill="#FEF3C7" height="10" style="stroke:#1F2937;stroke-width:0.5;" width="15" x="536.0712" y="521.6079"/><rect fill="#FEF3C7" height="2" style="stroke:#1F2937;stroke-width:0.5;" width="4" x="534.0712" y="523.6079"/><rect fill="#FEF3C7" height="2" style="stroke:#1F2937;stroke-width:0.5;" width="4" x="534.0712" y="527.6079"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.1912" x="324.88" y="551.5739">denote: &#956;-calculus model check</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.5972" x="324.88" y="570.6418">&#10214;&#966;&#10215; &#8838; S by fixpoint iteration</text></g><!--entity EV--><g class="entity" data-qualified-name="EV" data-source-line="30" id="ent0005"><rect fill="#DCFCE7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="385.9446" x="7" y="663.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.878" x="17" y="688.7039">evaluate(&#966;, t) = (root &#8712; &#10214;&#966;&#10215;)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="365.9446" x="17" y="707.7718">the predicate decided in the behavioral Heyting algebra</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="38" id="ent0011"><path d="M591.53,536.8179 L591.53,564.5239 A0,0 0 0 0 591.53,564.5239 L1024.4223,564.5239 A0,0 0 0 0 1024.4223,564.5239 L1024.4223,546.8179 L1014.4223,536.8179 L796.25,536.8179 L673.06,438.0879 L788.25,536.8179 L591.53,536.8179 A0,0 0 0 0 591.53,536.8179" fill="#FEF3C7" style="stroke:#4338CA;stroke-width:0.5;"/><path d="M1014.4223,536.8179 L1014.4223,546.8179 L1024.4223,546.8179 L1014.4223,536.8179" fill="#FEF3C7" style="stroke:#4338CA;stroke-width:0.5;"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411.8923" x="597.53" y="555.7149">no implicit truncation: missing edges can make [a]&#966; vacuously true.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="42" id="ent0014"><path d="M427.97,670.1079 L427.97,715.5199 A0,0 0 0 0 427.97,715.5199 L903.9704,715.5199 A0,0 0 0 0 903.9704,715.5199 L903.9704,680.1079 L893.9704,670.1079 L633.14,670.1079 L488.78,585.2379 L625.14,670.1079 L427.97,670.10