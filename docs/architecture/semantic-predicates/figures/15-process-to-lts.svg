-type="dependency" data-source-line="34" id="lnk8"><path d="M568.6,438.0879 C538.62,462.7579 505.4119,490.0821 477.6019,512.9521" fill="none" id="BL-to-DN" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="473.74,516.1279,483.232,513.5009,477.6019,512.9521,478.1507,507.3219,473.74,516.1279" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.4181" x="533.61" y="482.5049">finite reachable LTS</text></g><!--link DN to EV--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="35" id="lnk9"><path d="M377.16,585.2379 C337.58,609.0479 289.3145,638.0706 251.7445,660.6706" fill="none" id="DN-to-EV" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="247.46,663.2479,257.2341,662.0363,251.7445,660.6706,253.1103,655.1811,247.46,663.2479" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.1201" x="324.46" y="629.6349">root membership</text></g><g class="legend" data-source-line="46"><rect fill="none" height="109.3396" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="642.1677" x="378.2546" y="741.8738"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="36.9179" x="386.8946" y="763.8397">Color</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="39.3819" x="431.0924" y="763.8397">Stage</text><rect fill="#DBEAFE" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="383.2546" y="767.9417"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="383.2546" y="782.9076">&#160;</text><text fill="#000000" font-fam