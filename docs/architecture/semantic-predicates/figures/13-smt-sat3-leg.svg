<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="869px" preserveAspectRatio="none" style="width:989px;height:869px;background:#FEFEFE;" version="1.1" viewBox="0 0 989 869" width="989px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FEFEFE" height="869" style="stroke:none;stroke-width:1;" width="989" x="0" y="0"/><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="564.8839" x="208.7728" y="24.9659">The SMT leg stops at Sat3: a semi-decidable oracle never reaches BooleanAlgebra</text></g><!--entity DEC--><g class="entity" data-qualified-name="DEC" data-source-line="26" id="ent0001"><rect fill="#DCFCE7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="242.3751" x="376.9074" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.4673" x="386.9074" y="72.0339">decidable ConstraintTheory</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="222.3751" x="386.9074" y="91.1018">(Presburger / Unification / Lattice)</text></g><!--entity BR--><g class="entity" data-qualified-name="BR" data-source-line="27" id="ent0002"><rect fill="#E0E7FF" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="241.0311" x="220.5774" y="184.2079"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.8335" x="230.5774" y="209.1739">TheoryAlgebra&lt;T&gt;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.5254" x="230.5774" y="228.2418">the two-valued bridge:</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.0311" x="230.5774" y="247.3097">is_satisfiable = witness().is_some()</text></g><!--entity BA--><g class="entity" data-qualified-name="BA" data-source-line="28" id="ent0003"><ellipse cx="160.0974" cy="380.8279" fill="#DBEAFE" rx="8" ry="8" style="stroke:#1F2937;stroke-width:0.5;"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.3636" x="6" y="412.7939">BooleanAlgebra</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308.1948" x="6" y="431.8618">(SFA: complement, determinize, equivalence &#8212;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.7354" x="6" y="450.9297">needs a TOTAL algebra)</text></g><!--entity Z3--><g class="entity" data-qualified-name="Z3" data-source-line="34" id="ent0006"><rect fill="#FEF3C7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="316.1268" x="497.0374" y="193.7379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.0332" x="507.0374" y="218.7039">Z3Theory (feature smt, libz3)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="296.1268" x="507.0374" y="237.7718">ConstraintTheory over Bool / LIA / bit-vectors</text></g><!--entity S3--><g class="entity" data-qualified-name="S3" data-source-line="35" id="ent0007"><rect fill="#FEF3C7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="246.5051" x="712.8474" y="351.7579"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.5051" x="722.8474" y="376.7239">is_satisfiable_3v / checked_witness</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.8314" x="722.8474" y="395.7918">the three-valued surface</text></g><!--entity SAT3--><g class="entity" data-qualified-name="SAT3" data-source-line="36" id="ent0008"><rect fill="#FEF3C7" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="309.8269" x="343.1874" y="500.2379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.1592" x="353.1874" y="525.2039">Sat3 = Sat | Unsat | DontKnow</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272.0299" x="353.1874" y="544.2718">unknown &#8614; DontKnow &#8614; reject-safe false</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.8269" x="353.1874" y="563.3397">(into_safe_bool forces the caller to handle it)</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="46" id="ent0013"><path d="M299.8274,638.4379 L299.8274,701.556 A0,0 0 0 0 299.8274,701.556 L696.3587,701.556 A0,0 0 0 0 696.3587,701.556 L696.3587,648.4379 L686.3587,638.4379 L502.0974,638.4379 L498.0974,577.8879 L494.0974,638.4379 L299.8274,638.4379 A0,0 0 0 0 299.8274,638.4379" fill="#FEFFDD" style="stroke:#1F2937;stroke-width:0.5;"/><path d="M686.3587,638.4379 L686.3587,648.4379 L696.3587,648.4379 L686.3587,638.4379" fill="#FEFFDD" style="stroke:#1F2937;stroke-width:0.5;"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.5643" x="305.8274" y="657.3349">checked_witness re-evaluates a Sat model before believing it</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.3912" x="305.8274" y="675.0409">(certificate; Z3WitnessChecked.v: checked_witness_sound,</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.5313" x="305.8274" y="692.747">checked_witness_evaluates, checked_witness_no_fabrication).</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="52" id="ent0016"><path d="M204.5574,340.4079 L204.5574,376.8279 L169.4274,380.8279 L204.5574,384.8279 L204.5574,421.232 A0,0 0 0 0 204.5574,421.232 L677.6326,421.232 A0,0 0 0 0 677.6326,421.232 L677.6326,350.4079 L667.6326,340.4079 L204.5574,340.4079 A0,0 0 0 0 204.5574,340.4079" fill="#FEE2E2" style="stroke:#1F2937;stroke-width:0.5;"/><path d="M667.6326,340.4079 L667.6326,350.4079 L677.6326,350.4079 L667.6326,340.4079" fill="#FEE2E2" style="stroke:#1F2937;stroke-width:0.5;"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.8954" x="210.5574" y="359.3049">Z3 must NOT reach here. Routing a semi-decidable oracle through the</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="452.0753" x="210.5574" y="377.0109">two-valued bridge would collapse unknown into a false Unsat &#8212; unsound.</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.0564" x="210.5574" y="394.717">Z3Theory implements ONLY ConstraintTheory, never BooleanAlgebra; no</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.8693" x="210.5574" y="412.423">TheoryAlgebra&lt;Z3Theory&gt; is ever constructed.</text></g><!--link DEC to BR--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="30" id="lnk4"><path d="M467.4574,105.3779 C443.1774,127.7479 412.7147,155.8201 386.0347,180.4001" fill="none" id="DEC-to-BR" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="382.3574,183.7879,391.6868,180.6316,386.0347,180.4001,386.2662,174.748,382.3574,183.7879" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.2661" x="434.6574" y="150.1049">decidable (Some / None)</text></g><!--link BR to BA--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="31" id="lnk5"><path d="M281.8974,261.8679 C251.6274,282.9379 215.3374,310.8079 187.0974,340.4079 C177.9374,350.0179 172.1967,358.689 167.2967,367.089" fill="none" id="BR-to-BA" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="164.7774,371.4079,172.7673,365.6494,167.2967,367.089,165.8571,361.6184,164.7774,371.4079" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.0381" x="239.2174" y="306.3049">lifts to a classical EBA</text></g><!--link Z3 to S3--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="38" id="lnk9"><path d="M720.6374,252.2479 C740.4574,262.7579 761.3674,275.9379 778.0974,291.4079 C796.5574,308.4879 809.4789,328.2208 819.7189,346.9508" fill="none" id="Z3-to-S3" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="822.1174,351.3379,821.3098,341.5222,819.7189,346.9508,814.2903,345.3599,822.1174,351.3379" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.6721" x="794.7574" y="306.3049">never lifted to TheoryAlgebra</text></g><!--link S3 to SAT3--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" data-source-line="39" id="lnk10"><path d="M774.4974,410.2579 C720.1374,435.3479 644.9971,470.0325 585.1371,497.6625" fill="none" id="S3-to-SAT3" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="580.5974,499.7579,590.4452,499.6179,585.1371,497.6625,587.0925,492.3543,580.5974,499.7579" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.5321" x="678.2274" y="466.1349">exits here and STOPS</text></g><!--link Z3 to BA--><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" data-link-type="dependency" data-source-line="42" id="lnk11"><path d="M574.4574,252.3479 C519.4174,270.9779 444.5374,294.6679 377.0974,310.4079 C293.8474,329.8479 259.3774,294.7579 187.0974,340.4079 C175.4574,347.7679 169.5968,357.5928 165.4868,366.7928" fill="none" id="Z3-to-BA" style="stroke:#FEE2E2;stroke-width:1.3;stroke-dasharray:7,7;"/><polygon fill="#FEE2E2" points="163.4474,371.3579,170.7705,364.7722,165.4868,366.7928,163.4662,361.5091,163.4474,371.3579" style="stroke:#FEE2E2;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.2128" x="447.6374" y="306.3049">forbidden (unknown &#8594; false Unsat)</text></g><!--link DEC to Z3--><!--link BR to S3--><!--link BA to SAT3--><g class="legend" data-source-line="63"><rect fill="none" height="128.4075" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="376.4486" x="593.9809" y="722.556"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="36.9179" x="602.6209" y="744.5219">Color</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="61.1798" x="646.8188" y="744.5219">Meaning</text><rect fill="#DCFCE7" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="598.9809" y="748.6239"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="598.9809" y="763.5898">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="291.8429" x="646.8188" y="763.5898">decidable theory &#8212; reaches BooleanAlgebra</text><rect fill="#E0E7FF" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="598.9809" y="767.6918"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textL