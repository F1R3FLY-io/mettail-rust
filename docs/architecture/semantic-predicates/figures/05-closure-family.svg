ily="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.5258" x="382.36" y="118.0339">Bag&lt;A&gt;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.2737" x="382.36" y="137.1018">(BagAlgebra)</text></g><!--entity Map--><g class="entity" data-qualified-name="Comb.Map" data-source-line="36" id="ent0015"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="108.8717" x="512.56" y="93.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.9957" x="522.56" y="118.0339">Map&lt;K,V&gt;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="88.8717" x="522.56" y="137.1018">(MapAlgebra)</text></g><!--entity List--><g class="entity" data-qualified-name="Comb.List" data-source-line="37" id="ent0016"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="120.2256" x="656.89" y="93.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.6698" x="666.89" y="118.0339">List&lt;A&gt;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.2256" x="666.89" y="137.1018">(RegexAlgebra)</text></g><!--entity Tree--><g class="entity" data-qualified-name="Comb.Tree" data-source-line="38" id="ent0017"><rect fill="#BBF7D0" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="109.0677" x="812.47" y="93.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.3198" x="822.47" y="118.0339">Tree&lt;A&gt;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.0677" x="822.47" y="137.1018">(TreeAlgebra)</text></g><!--entity Any--><g class="entity" data-qualified-name="Any" data-source-line="17" id="ent0001"><rect fill="#DCFCE7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="404.2845" x="356.86" y="277.2579"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.0477" x="366.86" y="302.2239">AnyAlgebra</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="384.2845" x="366.86" y="321.2918">(single closed-enum carrier &#8212; one Predicate/Domain type)</text></g><g class="entity" data-qualified-name="GMN26" data-source-line="53" id="ent0027"><path d="M886.7,248.2079 L886.7,364.444 L1305.2923,364.444 L1305.2923,258.2079 L1295.2923,248.2079 L886.7,248.2079" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1295.2923,248.2079 L1295.2923,258.2079 L1305.2923,258.2079 L1295.2923,248.2079" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.8243" x="892.7" y="267.1049">Each closure is ITSELF a BooleanAlgebra / reject-safe algebra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.9178" x="892.7" y="284.8109">&#8658; the SFA/SFT code and the algebra-agnostic proofs are reused</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.5923" x="892.7" y="302.517">UNCHANGED. Generalizing "over all data types" = completing the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.3752" x="892.7" y="320.223">family of instances + closing it under type constructors,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.1653" x="892.7" y="337.929">not rewriting the automata. First-order pattern matching</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.4363" x="892.7" y="355.635">is subsumed: a pattern lowers to a TreePred&lt;AnyAlgebra&gt;.</text></g><!--link Any to Leaves--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="41" id="lnk18"><path d="M559,335.6279 C559,362.2029 559,397.9154 559,432.4117" fill="none" id="Any-to-Leaves" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="559,437.4117,563,428.4117,559,432.4117,555,428.4117,559,437.4117" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="40.807" x="560" y="409.3449">unifies</text></g><!--link Any to Comb--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="dependency" data-source-line="42" id="lnk19"><path d="M717.36,276.7679 C830.63,255.5779 964.54,228.6379 973,218.2079 C986.29,201.8329 982.6225,178.5479 975.47,159.1217 C973.6819,154.2651 971.6759,149.6497 969.6627,145.4438 C968.6561,143.3408 967.6476,141.3402 966.6637,139.4629 C966.1717,138.5243 965.6858,137.6165 965.2094,136.7423 C965.1498,136.633 967.4915,140.91 967.4322,140.8017" fill="none" id="Any-to-Comb" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="965.0312,136.416,965.8445,146.2312,967.4322,140.8017,972.8617,142.3895,965.0312,136.416" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="40.807" x="982.05" y="214.1049">unifies</text></g><!--link Product to Any--><g class="link" data-entity-1="ent0012" data-entity-2="ent0001" data-link-type="dependency" data-source-line="45" id="lnk20"><path d="M146.07,151.6079 C172.65,172.5779 211.29,200.4379 249,218.2079 C302.73,243.5279 360.4143,261.5955 415.1843,275.5255" fill="none" id="Product-to-Any" style="stroke:#374151;stroke-width:1.3;stroke-dasharray:7,7;"/><polygon fill="#374151" points="420.03,