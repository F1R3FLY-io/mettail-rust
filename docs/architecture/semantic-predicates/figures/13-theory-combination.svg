7" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.2953" x="369.37" y="72.0339">complete shared universe D</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.6711" x="369.37" y="91.1018">enum_all : every d is enumerated</text></g><!--entity ExactJoin--><g class="entity" data-qualified-name="ExactJoin" data-source-line="37" id="ent0012"><rect fill="#DCFCE7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="278.649" x="338.88" y="195.5479"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248.737" x="348.88" y="220.5139">combined DecidableConstraintTheory</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="258.649" x="348.88" y="239.5818">decide_exact by exhaustive joint search</text></g><!--entity Boolean--><g class="entity" data-qualified-name="Boolean" data-source-line="38" id="ent0013"><ellipse cx="369.2" cy="382.6279" fill="#CCFBF1" rx="8" ry="8" style="stroke:#1F2937;stroke-width:0.5;"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.6633" x="281.8683" y="414.5939">combined BooleanAlgebra</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="46" id="ent0020"><path d="M652.81,184.1979 L652.81,220.6079 L617.71,224.6079 L652.81,228.6079 L652.81,265.022 A0,0 0 0 0 652.81,265.022 L1005.5963,265.022 A0,0 0 0 0 1005.5963,265.022 L1005.5963,194.1979 L995.5963,184.1979 L652.81,184.1979 A0,0 0 0 0 652.81,184.1979" fill="#FEFFDD" style="stroke:#1F2937;stroke-width:0.5;"/><path d="M995.5963,184.1979 L995.5963,194.1979 L1005.5963,194.1979 L995.5963,184.1979" fill="#FEFFDD" style="stroke:#1F2937;stroke-width:0.5;"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.6752" x="658.81" y="203.0949">This is the exact enumerable base case proved in</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.7863" x="658.81" y="220.8009">TheoryCombination.v. Full Nelson-Oppen combination</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.5392" x="658.81" y="238.507">over infinite domains requires its stronger hypotheses</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.4682" x="658.81" y="256.213">and is not inferred from a search bound.</text></g><!--entity Formal--><g class="entity" data-qualified-name="Formal" data-source-line="52" id="ent0022"><rect fill="#E0E7FF" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="198.5693" x="832.92" y="344.0279"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.5114" x="842.92" y="368.9939">TheoryCombination.v</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.5693" x="842.92" y="388.0618">csat_sound &#183; csat_complete</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.6275" x="842.92" y="407.1297">combined_eba_laws</text></g><!--link A to BoundedJoin--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="26" id="lnk5"><path d="M87.24,253.8679 C100.25,282.0479 118.0241,320.5784 131.0441,348.7784" fill="none" id="A-to-BoundedJoin" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="133.14,353.3179,132.999,343.4701,131.0441,348.7784,125.7358,346.8235,133.14,353.3179" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="35.932" x="115.51" y="309.9249">factor</text></g><!--link B to BoundedJoin--