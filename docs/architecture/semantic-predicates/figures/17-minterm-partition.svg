maximal satisfiable</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.7334" x="149.98" y="229.3097">sign-vector conjunctions</text></g><!--entity MSG--><g class="entity" data-qualified-name="MSG" data-source-line="26" id="ent0007"><rect fill="#DCFCE7" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="144.9495" x="355.87" y="166.2079"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.4877" x="365.87" y="191.1739">message m</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.9495" x="365.87" y="210.2418">classified once into</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.8196" x="365.87" y="229.3097">exactly one cell</text></g><!--entity OUT--><g class="entity" data-qualified-name="OUT" data-source-line="27" id="ent0008"><rect fill="#DCFCE7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="148.3795" x="410.16" y="514.8879"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.3795" x="420.16" y="539.8539">accepting contracts</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.5596" x="420.16" y="558.9218">(dispatch result)</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="35" id="ent0014"><path d="M6,503.5479 L6,584.372 L374.6983,584.372 L374.6983,513.5479 L364.6983,503.5479 L6,503.5479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M364.6983,503.5479 L364.6983,513.5479 L374.6983,513.5479 L364.6983,503.5479" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.6983" x="12" y="522.4449">"All elements in the same minterm are treated identically</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.2242" x="12" y="540.1509">by every predicate" &#8212; so a cell names exactly which</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.9843" x="12" y="557.857">contracts accept m. Worst case 2^N cells; build it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.0581" x="12" y="575.563">per channel and lazily.</text></g><!--link PREDS to CM--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="29" id="lnk9"><path d="M230.35,105.5679 C230.35,125.5479 230.35,147.2779 230.35,167.8179" fill="none" id="PREDS-to-CM" style="stroke:#374151;stroke-width:1.2;"/><polygon fill="#374151" points="230.35,172.8179,234.35,163.8179,230.35,167.8179,226.35,163.8179,230.35,172.8179" style="stroke:#374151;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CM to CELLS--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="30" id="lnk10"><path d="M239.86,236.8079 C248.185,263.9629 260.545,304.2779 270.9512,338.2204 C273.5528,346.706 276.0323,354.7934 278.296,362.1773 C279.4279,365.8692 280.5059,369.3853 281.5182,372.6873 C281.7713,373.5128 280.5547,369.5446 280.7994,370.3427" fill="none" id="CM-to-CELLS" style="stroke:#374151;stroke-width:1.2;"/><polygon fill="#374151" points="282.265,375.1231,283.4513,365.346,280.7994,370.3427,275.8027,367.6909,282.265,375.1231" style="stroke:#374151;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.3181" x="263.15" y="288.3049">is_satisfiable prunes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.7411" x="272.4385" y="306.0109">unrealizable 