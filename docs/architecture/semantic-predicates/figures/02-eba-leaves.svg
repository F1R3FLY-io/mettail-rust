<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="428px" preserveAspectRatio="none" style="width:1272px;height:428px;background:#FEFEFE;" version="1.1" viewBox="0 0 1272 428" width="1272px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FEFEFE" height="428" style="stroke:none;stroke-width:1;" width="1272" x="0" y="0"/><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="382.1286" x="441.8409" y="24.9659">The Effective-Boolean-Algebra leaf instances (all exact)</text></g><!--entity Interval--><g class="entity" data-qualified-name="Interval" data-source-line="18" id="ent0001"><rect fill="#DBEAFE" height="96.2717" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="285.817" x="7" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.0176" x="17" y="72.0339">IntervalAlgebra</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.7493" x="17" y="91.1018">domain: i64 over [min, max)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="265.817" x="17" y="110.1697">procedure: normalized half-open ranges</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.2795" x="17" y="129.2376">EXACT (Lemma 5.5)</text></g><!--entity CharClass--><g class="entity" data-qualified-name="CharClass" data-source-line="20" id="ent0002"><rect fill="#DBEAFE" height="96.2717" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="233.8772" x="327.97" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.1716" x="337.97" y="72.0339">CharClassAlgebra</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.9214" x="337.97" y="91.1018">domain: char (Unicode)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.8772" x="337.97" y="110.1697">procedure: u32 range arithmetic</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.2795" x="337.97" y="129.2376">EXACT (Lemma 5.5)</text></g><!--entity Kat--><g class="entity" data-qualified-name="Kat" data-source-line="22" id="ent0003"><rect fill="#DBEAFE" height="96.2717" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="210.3993" x="596.71" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.9375" x="606.71" y="72.0339">KatBooleanAlgebra</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.3993" x="606.71" y="91.1018">domain: 2^n truth valuations</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.8893" x="606.71" y="110.1697">procedure: enumerate 2^n</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.2795" x="606.71" y="129.2376">EXACT (Lemma 5.6)</text></g><!--entity OrderedField--><g class="entity" data-qualified-name="OrderedField" data-source-line="25" id="ent0004"><rect fill="#DCFCE7" height="96.2717" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="312.5009" x="841.66" y="47.0679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.3014" x="851.66" y="72.0339">OrderedFieldAlgebra&lt;P&gt;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248.639" x="851.66" y="91.1018">domain: Bound-interval unions over P</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="292.5009" x="851.66" y="110.1697">procedure: witness_in oracle (density-aware)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="216.4391" x="851.66" y="129.2376">EXACT per domain (Theorem 5.7)</text></g><!--entity Presburger--><g class="entity" data-qualified-name="Presburger" data-source-line="27" id="ent0005"><rect fill="#DCFCE7" height="96.2717" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="285.775" x="7.02" y="203.3379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.4955" x="17.02" y="228.3039">PresburgerAlgebra</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.3514" x="17.02" y="247.3718">domain: integer tuples</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="265.775" x="17.02" y="266.4397">procedure: NFA non-emptiness (no SMT)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.5052" x="17.02" y="285.5076">EXACT bounded window (5.1)</text></g><!--entity Regex--><g class="entity" data-qualified-name="Regex" data-source-line="29" id="ent0006"><rect fill="#CCFBF1" height="96.2717" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="304.5349" x="327.64" y="203.3379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.9812" x="337.64" y="228.3039">StringAlgebra / RegexAlgebra&lt;A&gt;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.5152" x="337.64" y="247.3718">domain: sequences (A::Domain)*</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="284.5349" x="337.64" y="266.4397">procedure: SFA emptiness (Thompson NFA)</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.4851" x="337.64" y="285.5076">EXACT regular langs (Theorem 5.8)</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="32" id="ent0008"><path d="M738,228.7679 L738,274.1799 A0,0 0 0 0 738,274.1799 L1257.8104,274.1799 A0,0 0 0 0 1257.8104,274.1799 L1257.8104,238.7679 L1247.8104,228.7679 L1001.91,228.7679 L997.91,143.7479 L993.91,228.7679 L738,228.7679 A0,0 0 0 0 738,228.7679" fill="#FEFFDD" style="stroke:#1F2937;stroke-width:0.5;"/><path d="M1247.8104,228.7679 L1247.8104,238.7679 L1257.8104,238.7679 L1247.8104,228.7679" fill="#FEFFDD" style="stroke:#1F2937;stroke-width:0.5;"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.3994" x="744" y="247.6649">discrete P (BigInt, i128): open (n, n+1) is EMPTY (successor gap);</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="498.8104" x="744" y="265.3709">dense P (BigRational, OrderedF64): every non-degenerate interval has a midpoint.</text></g><g class="legend" data-source-line="36"><rect fill="none" height="90.2717" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="313.3788" x="940.4316" y="319.6096"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="36.9179" x="949.0716" y="341.5755">Color</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="43.0918" x="993.2694" y="341.5755">Group</text><rect fill="#DBEAFE" height="19.0679" style="stroke:none;stroke-width:1;" width="44.1978" x="945.4316" y="345.6775"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="945.4316" y="360.6434">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="204.5392" x="993.2694" y="360.6434">exact / decidable / classical leaf</text><rect fill="#DCFCE7" height="19.0679" style="stro