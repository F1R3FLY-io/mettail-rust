yle="stroke:#1F2937;stroke-width:0.5;"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.0095" x="30.3555" y="452.9649">P0 &#8764; Q0 &#8658; they satisfy the SAME behavioral predicates:</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.1194" x="30.3555" y="470.6709">evaluate(AG &#172;bad, P0) = evaluate(AG &#172;bad, Q0)  (Theorem 4.2).</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.2094" x="30.3555" y="488.377">A behavioral guard is a property of behavior, not representation</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.9258" x="30.3555" y="506.083">&#8212; well-defined on the quotient S / &#8764;.</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.067" x="30.3555" y="523.789">(Hennessy-Milner: bisimilar &#10234; same modal formulas.)</text></g><!--link P0 to P1--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="32" id="lnk7"><path d="M386.5455,97.5579 C374.6755,120.0479 359.5179,148.7652 347.6679,171.2352" fill="none" id="P0-to-P1" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="345.3355,175.6579,353.0719,169.563,347.6679,171.2352,345.9957,165.8312,345.3355,175.6579" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="26.247" x="370.9755" y="141.9649">step</text></g><!--link P1 to P2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="33" id="lnk8"><path d="M313.3755,226.5579 C295.8455,249.0479 273.08,278.2448 255.56,300.7148" fill="none" id="P1-to-P2" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151"