font-size="14" lengthAdjust="spacing" textLength="16.4779" x="225.2166" y="325.0339">P2</text></g><g class="entity" data-qualified-name="Q0" data-source-line="27" id="ent0004"><rect fill="#FEF3C7" height="50" rx="12.5" ry="12.5" style="stroke:#1F2937;stroke-width:0.5;" width="147.566" x="408.6755" y="176.0679"/><line style="stroke:#1F2937;stroke-width:0.5;" x1="408.6755" x2="556.2415" y1="205.1358" y2="205.1358"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.566" x="418.6755" y="196.0339">Q0  (process Q &#8764; P)</text></g><g class="entity" data-qualified-name="Q1" data-source-line="28" id="ent0005"><rect fill="#FEF3C7" height="50" rx="12.5" ry="12.5" style="stroke:#1F2937;stroke-width:0.5;" width="50" x="467.4555" y="305.0679"/><line style="stroke:#1F2937;stroke-width:0.5;" x1="467.4555" x2="517.4555" y1="334.1358" y2="334.1358"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="18.9419" x="482.9846" y="325.0339">Q1</text></g><g class="entity" data-qualified-name="Q2" data-source-line="29" id="ent0006"><rect fill="#FEF3C7" height="50" rx="12.5" ry="12.5" style="stroke:#1F2937;stroke-width:0.5;" width="50" x="471.4555" y="458.3279"/><line style="stroke:#1F2937;stroke-width:0.5;" x1="471.4555" x2="521.4555" y1="487.3958" y2="487.3958"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="18.9419" x="486.9846" y="478.2939">Q2</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="41" id="ent0013"><path d="M24.3555,434.0679 L24.3555,532.598 A0,0 0 0 0 24.3555,532.598 L436.5649,532.598 A0,0 0 0 0 436.5649,532.598 L436.5649,444.0679 L426.5649,434.0679 L235.4255,434.0679 L232.9755,355.3679 L227.4255,434.0679 L24.3555,434.0679 A0,0 0 0 0 24.3555,434.0679" fill="#FEFFDD" style="stroke:#1F2937;stroke-width:0.5;"/><path d="M426.5649,434.0679 L426.5649,444.0679 L436.5649,444.0679 L426.5649,434.0679" fill="#FEFFDD" style="stroke:#1F2937;stroke-width:0.5;"/><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.3155" x="30.3555" y="452.9649">`P0 &#8764; Q0` &#8658; they satisfy the SAME behavioral predicates:</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.4254" x="30.3555" y="470.6709">`evaluate(AG &#172;bad, P0) = evaluate(AG &#172;bad, Q0)`  (Theorem 4.2).</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.2094" x="30.3555" y="488.377">A behavioral guard is a property of behavior, not representation</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.2318" x="30.3555" y="506.083">&#8212; well-defined on the quotient `S / &#8764;`.</text><text fill="#111827" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.067" x="30.3555" y="523.789">(Hennessy-Milner: bisimilar &#10234; same modal formulas.)</text></g><!--link P0 to P1--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="32" id="lnk7"><path d="M386.5455,97.5579 C374.6755,120.0479 359.5179,148.7652 347.6679,171.2352" fill="none" id="P0-to-P1" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#374151" points="345.3355,175.6579,353.0719,169.563,347.6679,171.2352,345.9957,165.8312,345.3355,175.6579" style="stroke:#374151;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="26.247" x="370.9755" y="141.9649">step</text></g><!--link P1 to P2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="33" id="lnk8"><path d="M313.3755,226.5579 C295.8455,249.0479 273.08,278.2448 255.56,300.7148" fill="none" id="P1-to-P2" style="stroke:#374151;stroke-width:1.3;"/><polygon fill="#3