277.9457"/><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="141.2034" x="118.3959" y="250.7758">H_reg = { a : &#172;&#172;a = a }</text><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="135.2395" x="121.3779" y="269.8438">(a Boolean algebra)</text></g><!--entity M--><g class="entity" data-qualified-name="H.M" data-source-line="21" id="ent0002"><rect fill="#FEF3C7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="124.1735" x="96.3059" y="84.6699"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="12.698" x="106.3059" y="109.6358">M</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.1735" x="106.3059" y="128.7038">(`&#172;&#172;M = &#8868; &#8800; M`)</text></g><!--entity Phi--><g class="entity" data-qualified-name="H.Phi" data-source-line="22" id="ent0003"><rect fill="#FEF3C7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="129.5216" x="255.6359" y="84.6699"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.5216" x="265.6359" y="109.6358">&#966; with boundary</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.8717" x="265.6359" y="128.7038">(`&#172;&#172;&#966; &gt; &#966;`)</text></g><!--entity Bot--><g class="entity" data-qualified-name="H.Hreg.Bot" data-source-line="26" id="ent0005"><rect fill="#DCFCE7" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="32.1953" x="138.2959" y="298.8099"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="12.1953" x="148.2959" y="323.7758">&#8869;</text></g><!--entity Top--><g class="entity" data-qualified-name="H.Hreg.Top" data-source-line="27" id="ent0006"><rect fill="#DCFCE7" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="32.1953" x="205.2959" y="298.8099"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="12.1953" x="215.2959" y="323.7758">&#8868;</text></g><!--entity NegPhi--><g class="entity" data-qualified-name="H.Hreg.NegPhi" data-source-line="28" id="ent0007"><rect fill="#DCFCE7" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="38.1579" x="272.3159" y="298.8099"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="18.1579" x="282.3159" y="323.7758">&#172;&#966;</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="37" id="ent0011"><path d="M155.0759,440.8799 L155.0759,521.704 L535.7239,521.704 L535.7239,450.8799 L525.7239,440.8799 L155.0759,440.8799" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M525.7239,440.8799 L525.7239,450.8799 L535.7239,450.8799 L525.7239,440.8799" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.2161" x="161.0759" y="459.7769">Regular elements form a</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="105.5991" x="315.6721" y="459.7769">Boolean algebra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.0728" x="424.6511" y="459.7769">under `(&#8743;, &#8852;, &#172;)`</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.5707" x="161.0759" y="477.4829">with `&#8852; = &#172;(&#172;a &#8743; &#172;b)`; excluded middle `a &#8852; &#172;a = &#8868;` holds</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.1372" x="161.0759" y="495.1889">there (`excluded_middle_reg`)