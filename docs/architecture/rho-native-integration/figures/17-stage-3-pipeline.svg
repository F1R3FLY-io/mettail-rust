733" y="211.3049">ONE positional set automaton. Each accept channel is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.2383" x="260.4733" y="229.0109">sourced from rho_net_injection_sites (the &#963;-receiver</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.0944" x="260.4733" y="246.7169">SOURCE &#8212; the triad anchor). TOTAL partition: every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.5793" x="260.4733" y="264.4229">rewrite is an automaton entry OR a reasoned skip.</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="208.4733" x="26" y="205.7948"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.4733" x="36" y="228.6229">compile_in_rho_matching_ruleset</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="191.8172" x="34.3281" y="293.2319"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.2329" x="44.3281" y="316.06">InRhoMatchingRuleset</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.8172" x="44.3281" y="332.4041">(automaton + accept_channels</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.381" x="44.3281" y="348.7482">+ fingerprint + skip-list)</text><line style="stroke:#000000;stroke-width:1.5;" x1="20" x2="20" y1="58.8419" y2="1143.361"/><rect fill="#FCEBCF" height="1084.5191" style="stroke:#FCEBCF;stroke-width:1;" width="309.1844" x="607.5796" y="58.8419"/><rect fill="#F1F1F1" height="52.6882" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="232.1015" x="647.1211" y="382.2643"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="84.9126" x="657.1211" y="405.0924">Dovetail report</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.1015" x="657.1211" y="421.4365">(the firing justification, host-matched)</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="243.9336" x="641.2051" y="510.4072"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.2334" x="651.2051" y="533.2353">GATE REJECT &#8212; fall CLOSED to the</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.0052" x="651.2051" y="549.5794">host-matched &#963;-replay driver</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.9336" x="651.2051" y="565.9235">(the language stays on its existing path)</text><ellipse cx="763.1719" cy="610.4396" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="763.1719" cy="610.4396" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFF3E0" points="671.9495,454.9525,854.3942,454.9525,866.3942,469.9344,854.3942,484.9163,671.9495,484.9163,659.9495,469.9344,671.9495,454.9525" style="stroke:#E65100;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="767.1719" y="496.6752">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="182.4447" x="671.9495" y="466.7114">every FIRED rule matchable in Rho?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="104.1913" x="671.9495" y="481.6933">FV (ix) install_admits</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="866.3942" y="466.7114">yes</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="239.5656" x="643.3891" y="663.4396"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.0415" x="653.3891" y="686.2677">reconstruct the ground subject LHS[&#963;]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.5656" x="653.3891" y="702.6118">(root-rooted single redex; nested/multi</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.8635" x="653.3891" y="718.9559">fail closed &#8594; Stage 4)</text><rect fill="#F1F1F1" height="74.4803" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="299.1844" x="613.5796" y="752.4719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.6688" x="623.5796" y="775.3">in_rho_match_call_par</text><text fill="#000000" font-family="sans-serif" font-size="16" font-weight="700" lengthAdjust="spacing" textLength="279.1844" x="623.5796" y="795.9201">receiver network  &#8214;  subject spread</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.844" x="623.5796" y="813.4362">(single-shot, per-site nonce &#8594; O1)</text><line style="stroke:#000000;stroke-width:1.5;" x1="607.5796" x2="607.5796" y1="58.8419" y2="1143.361"/><rect fill="#D6EBDA" height="1084.5191" style="stroke:#D6EBDA;stroke-width:1;" width="385.3157" x="916.7641" y="58.8419"/><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-width:0.5;" width="170.7091" x="1025.0674" y="846.9522"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.7091" x="1035.0674" y="869.7803">installed &#963;-receivers  &#8214;  call</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#37474F;stroke-widt