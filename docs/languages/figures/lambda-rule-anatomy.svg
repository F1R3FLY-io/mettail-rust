<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="779px" preserveAspectRatio="none" style="width:1129px;height:779px;background:#FEFEFE;" version="1.1" viewBox="0 0 1129 779" width="1129px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FEFEFE" height="779" style="stroke:none;stroke-width:1;" width="1129" x="0" y="0"/><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="605.7778" x="258.2272" y="24.9659">Anatomy of one `terms` rule: `Lam . ^x.body:[Term -&gt; Term] |- "lam " x "." body : Term ;`</text></g><!--cluster SRC--><g class="cluster" data-qualified-name="SRC" data-source-line="12" id="ent0001"><rect fill="#F3F4F6" height="112.14" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:1;" width="803" x="46" y="118.0979"/><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="92.3996" x="401.3002" y="135.0639">SOURCE TEXT</text></g><!--cluster PARSED--><g class="cluster" data-qualified-name="PARSED" data-source-line="20" id="ent0007"><rect fill="#F3F4F6" height="188.4" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:1;" width="984" x="7" y="256.4379"/><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="202.7752" x="397.6124" y="273.4039">PARSED (ast/src/grammar.rs)</text></g><!--cluster OUT--><g class="cluster" data-qualified-name="OUT" data-source-line="27" id="ent0012"><rect fill="#F3F4F6" height="188.41" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:1;" width="895" x="92" y="468.8379"/><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="121.4355" x="478.7822" y="485.8039">GENERATED RUST</text></g><!--entity L_LABEL--><g class="entity" data-qualified-name="SRC.L_LABEL" data-source-line="13" id="ent0002"><rect fill="#E0E7FF" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="51.5839" x="172.21" y="156.0979"/><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="29.8619" x="182.21" y="181.0639">Lam</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="31.5839" x="182.21" y="200.1318">label</text></g><!--entity L_CTX--><g class="entity" data-qualified-name="SRC.L_CTX" data-source-line="14" id="ent0003"><rect fill="#DBEAFE" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="193.4594" x="259.27" y="156.0979"/><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="160.1314" x="269.27" y="181.0639">^x.body:[Term -&gt; Term]</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.4594" x="269.27" y="200.1318">term context (metasyntax)</text></g><!--entity L_TURN--><g class="entity" data-qualified-name="SRC.L_TURN" data-source-line="15" id="ent0004"><rect fill="#F3F4F6" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="75.0198" x="62.49" y="156.0979"/><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="12.194" x="72.49" y="181.0639">|-</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.0198" x="72.49" y="200.1318">turnstile</text></g><!--entity L_SYN--><g class="entity" data-qualified-name="SRC.L_SYN" data-source-line="16" id="ent0005"><rect fill="#DCFCE7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="222.4952" x="487.75" y="156.0979"/><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="137.2975" x="497.75" y="181.0639">\"lam \" x \".\" body</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.4952" x="497.75" y="200.1318">concrete syntax (object syntax)</text></g><!--entity L_CAT--><g class="entity" data-qualified-name="SRC.L_CAT" data-source-line="17" id="ent0006"><rect fill="#FEF3C7" height="58.1358" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="87.3538" x="745.32" y="156.0979"/><text fill="#111827" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="43.9178" x="755.32" y="181.0639">: Term</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.3538" x="755.32" y="200.1318">result sort</text></g><!--entity P_LABEL--><g class="entity" data-qualified-name="PARSED.P_LABEL" data-source-line="21" id="ent0008"><rect fill="#E0E7FF" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="199.2833" x="23.36" y="342.1079"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.2833" x="33.36" y="367.0739">`GrammarRule.label = Lam`</text></g><!--entity P_CTX--><g class="entity" data-qualified-name="PARSED.P_CTX" data-source-line="22" id="ent0009"><rect fill="#DBEAFE" height="134.4075" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="197.3934" x="257.3" y="294.4379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.3934" x="267.3" y="319.4039">`TermParam::Abstraction {`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.8597" x="267.3" y="338.4718">`  binder: x,`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.2316" x="267.3" y="357.5397">`  body:   body,`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.1934" x="267.3" y="376.6076">`  ty: TypeExpr::Arrow {`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.6915" x="267.3" y="395.6755">`    domain:   Term,`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.7694" x="267.3" y="414.7434">`    codomain: Term } }`</text></g><!--entity P_SYN--><g class="entity" data-qualified-name="PARSED.P_SYN" data-source-line="23" id="ent0010"><rect fill="#DCFCE7" height="115.3396" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="219.3592" x="489.32" y="303.9679"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37.9679" x="499.32" y="328.9339">`vec![`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.3592" x="499.32" y="348.0018">`  SyntaxExpr::Literal(\"lam \"),`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.6334" x="499.32" y="367.0697">`  SyntaxExpr::Param(x),`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.9153" x="499.32" y="386.1376">`  SyntaxExpr::Literal(\".\"),`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.5513" x="499.32" y="405.2055">`  SyntaxExpr::Param(body) ]`</text></g><!--entity P_CAT--><g class="entity" data-qualified-name="PARSED.P_CAT" data-source-line="24" id="ent0011"><rect fill="#FEF3C7" height="39.0679" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="231.4972" x="743.25" y="342.1079"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.4972" x="753.25" y="367.0739">`GrammarRule.category = Term`</text></g><!--entity O_AST--><g class="entity" data-qualified-name="OUT.O_AST" data-source-line="28" id="ent0013"><rect fill="#DBEAFE" height="134.4075" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="279.293" x="108.35" y="506.8379"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.4037" x="118.35" y="531.8039">`Term::Lam(`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.9933" x="118.35" y="550.8718">`  Scope&lt; Binder&lt;String&gt;,`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.1315" x="118.35" y="569.9397">`         Arc&lt;Term&gt; &gt; )`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="118.35" y="589.0076">&#160;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259.293" x="118.35" y="608.0755">moniker `Scope` = binder + body as one</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="232.4131" x="118.35" y="627.1434">alpha-equivalence-respecting value</text></g><!--entity O_SURF--><g class="entity" data-qualified-name="OUT.O_SURF" data-source-line="29" id="ent0014"><rect fill="#DCFCE7" height="115.3396" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="296.3589" x="422.82" y="516.3779"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.6535" x="432.82" y="541.3439">parser production:</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.2495" x="432.82" y="560.4118">`Fixed(\"lam \")` -&gt;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="276.3589" x="432.82" y="579.4797">`ConsumeAndPush(rule_at(Term, Lam, 1))`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="3.64" x="432.82" y="598.5476">&#160;</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260.497" x="432.82" y="617.6155">display: `\"lam \" + name + \" . \" + body`</text></g><!--entity O_META--><g class="entity" data-qualified-name="OUT.O_META" data-source-line="30" id="ent0015"><rect fill="#FEF3C7" height="77.2038" rx="2.5" ry="2.5" style="stroke:#1F2937;stroke-width:0.5;" width="216.8672" x="754.57" y="535.4479"/><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.8672" x="764.57" y="560.4139">`FieldDef { name: \"^x.body\",`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.4374" x="764.57" y="579.4818">`  ty: \"[Term -&gt; Term]\",`</text><text fill="#111827" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.5795" x="764.57" y="598.5497">`  is_binder: true }`</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="44" id="ent0025"><path d="M867.76,135.9079 L867.76,234.438 L1114.2322,234.438 L1114.2322,145.9079 L1104.2322,135.9079 L867.76,135.9079" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1104.2322,135.9079 L1104.2322,145.9079 L1114.2322,145.9079 L1104.2322,135.9079" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4722" x="873.76" y="154.8049">Everything LEFT of `|-` is metasyntax:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.6182" x="873.76" y="172.5109">the abstract arguments and their</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.0571" x="873.76" y="190.217">BINDING STRUCTURE.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.0432" x="873.76" y="207.923">Everything RIGHT of `|-` is object</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.5472" x="873.76" y="225.629">syntax: what a programmer types.</text></g><g class="entity" data-qualified-name="GMN27" data-source-line="52" id="ent0028"><path d="M16.75,701.2479 L16.75,764.366 A0,0 0 0 0 16.75,764.366 L479.2435,764.366 A0,0 0 0 0 479.2435,764.366 L479.2435,711.2479 L469.2435,701.2479 L252,701.2479 L248,641.5279 L244,701.2479 L16.75,701.2479 A0,0 0 0 0 16.75,701.2479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M469.2435,701.2479 L469.2435,711.2479 L479.2435,711.2479 L469.2435,701.2479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.2643" x="22.75" y="720.1449">The single `[Term -&gt; Term]` abstraction is also what makes the macro</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="441.4935" x="22.75" y="737.8509">auto-inject the higher-order plumbing variants `LamTerm`, `MLamTerm`,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.5123" x="22.75" y="755.557">`ApplyTerm`, `MApplyTerm` into `enum Term`.</text></g><!--link L_LABEL to P_LABEL--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" data-source-line="33" id="lnk16"><path d="M185.78,214.5879 C170.34,250.5079 146.1752,306.7346 133.0252,337.3146" fill="none" id="L_LABEL-to-P_LABEL" style="stroke:#374151;stroke-width:1.2;"/><polygon fill="#374151" points="131.05,341.9079,138.28,335.2201,133.0252,337.3146,130.9307,332.0598,131.05,341.9079" style="stroke:#374151;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link L_CTX to P_CTX--><g class="link" data-entity-1="ent0003" data-entity-2="ent0009" data-link-type="dependency" data-source-line="34" id="lnk17"><path d="M356,214.5879 C356,236.1179 356,261.6079 356,289.1579" fill="none" id="L_CTX-to-P_CTX" style="str