[package]
name = "macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Procedural macros for MeTTaIL - a meta-language framework for defining formal languages"
readme = "../README.md"
publish = false

[lib]
name = "mettail_macros"
proc-macro = true

[features]
## Walker diagnostics/trace (2026-07-16): compile-time gate for the codegen-time
## `PRATTAIL_MACRO_TRACE` stage instrumentation emitted during `language!`
## expansion. OFF BY DEFAULT and zero-cost when off — the
## `std::env::var("PRATTAIL_MACRO_TRACE")` read is compiled out under
## `#[cfg(feature = "walker-trace")]`. Mirrors `prattail`'s feature of the same
## name (needed because the `PRATTAIL_MACRO_TRACE` stage tracer lives in this
## proc-macro crate too); `mettail-languages/walker-trace` turns on both. Enable
## with `--features walker-trace`, then select at runtime with
## `PRATTAIL_MACRO_TRACE=1`.
walker-trace = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
prettyplease = "0.2"
proc-macro-error = { workspace = true }
moniker = { workspace = true }
indexmap = { workspace = true }
mettail-ast = { package = "ast", path = "../ast" }
mettail-rholang-codegen = { package = "rholang-codegen", path = "../rholang-codegen" }
mettail-prattail = { package = "prattail", path = "../prattail" }
ascent_syntax_export = { workspace = true }
pathmap = { git = "https://github.com/dylon/PathMap.git", branch = "feature/mettatron-fixes" }
rustc-hash = "1.1"

[dev-dependencies]
trybuild = "1.0"
proptest = "1"
