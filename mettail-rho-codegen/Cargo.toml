description = "M-RHO bridge: COMPILE-TIME lowering of a MeTTaIL GSLT (LanguageDef) to a parallel-optimized Rholang VM — rules-as-data + Par, e-graph normalization, WTA/cost-Sig assignment, channel-keying. Depends ONE-WAY on f1r3node-rust."

# Compile-time only: lowers a `LanguageDef` to (a) reduction rules as `Par`
# contracts, (b) native system-process handlers, (c) the OslfResourceLogic adapter
# wiring. The e-graph / WTA / decision-tree stay COMPILE-TIME analyses that GENERATE
# indexing + ordering + recognition plugging into f1r3node's existing
# matcher/join/lock/check_commit. Depends ONE-WAY on f1r3node-rust (proven one-way
# in formal/rocq/rho_bridge/theories/BridgeInertness.v). Fully integrated (no
# feature gating). The LanguageDef->Rholang translator + rholang parse round-trip
# land in M-RHO.0.3 (when `rholang` is added as a dep here).

