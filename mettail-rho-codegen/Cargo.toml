[package]
name = "mettail-rho-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "M-RHO bridge: COMPILE-TIME lowering of a MeTTaIL GSLT (LanguageDef) to a parallel-optimized Rholang VM — rules-as-data + Par, e-graph normalization, WTA/cost-Sig assignment, channel-keying. Depends ONE-WAY on f1r3node-rust."

# Compile-time lowering of a MeTTaIL `LanguageDef` to f1r3node-rust Rholang.
# Depends ONE-WAY on f1r3node-rust (proven one-way in
# formal/rocq/rho_bridge/theories/BridgeInertness.v). Fully integrated (no gating).
# `mettail-ast` supplies the LanguageDef/GrammarRule types; the parse round-trip
# gate (rholang `Compiler::source_to_adt`) is a dev-dependency (the translator
# library itself is rholang-free — pure LanguageDef → String).

[dependencies]
mettail-ast = { path = "../ast" }
syn = { workspace = true }

[dev-dependencies]
rholang = { workspace = true }
models = { workspace = true }
