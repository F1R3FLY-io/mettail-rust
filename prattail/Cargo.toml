[package]
name = "mettail-prattail"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PraTTaIL: Pratt + Recursive Descent parser generator with automata-optimized lexing for MeTTaIL"

[features]
## Ascent parallel fixpoint: switches ascent! → ascent_par! for parallel rewriting.
## Currently broken by upstream ascent 0.8.0 codegen bug (E0596: mutable borrow
## in Fn closure). See docs/design/exploring/ascent_parallel_issue.md.
ascent-parallel = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
proptest = { version = "1" }
num-complex = { version = "0.4" }
nalgebra = { version = "0.33" }
pathmap = { git = "https://github.com/dylon/PathMap.git", branch = "feature/mettatron-fixes" }
regex-syntax = { version = "0.8", default-features = false, features = ["unicode"] }
im = { version = "15" }
crossbeam-channel = { version = "0.5" }
crossbeam-deque = { version = "0.8" }
dashmap = { version = "6" }
num_cpus = { version = "1" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "bench_end_to_end"
harness = false

[[bench]]
name = "bench_lexer"
harness = false

[[bench]]
name = "bench_analysis"
harness = false

[[bench]]
name = "bench_codegen"
harness = false

[[bench]]
name = "bench_lexer_codegen"
harness = false

[[bench]]
name = "bench_wfst"
harness = false

[[bench]]
name = "bench_dispatch"
harness = false

[[bench]]
name = "bench_presburger"
harness = false

[[bench]]
name = "bench_logict"
harness = false

[[bench]]
name = "bench_type_system"
harness = false

[[bench]]
name = "bench_sft"
harness = false

[[bench]]
name = "bench_egraph"
harness = false

[[bench]]
name = "bench_cesk_store"
harness = false

[[bench]]
name = "bench_green_threads"
harness = false
