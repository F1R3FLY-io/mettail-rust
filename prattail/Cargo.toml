[package]
name = "prattail"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PraTTaIL: Pratt + Recursive Descent parser generator with automata-optimized lexing for MeTTaIL"
publish = false

[lib]
name = "mettail_prattail"

[features]
## SIGUSR1 hang-dump (T4, 2026-05-05): debugging aid that lets the user send
## a signal to a running parser to capture a snapshot of walker state. See
## `prattail/src/hang_dump.rs` for details. Zero-cost when not enabled at
## runtime via `PRATTAIL_HANG_DUMP=1`.
##
## JSON output is hand-formatted (per feedback_postcard_over_serde_json:
## avoid serde_json; postcard is binary so doesn't fit human-readable dumps).
hang-dump = ["dep:signal-hook", "dep:parking_lot"]
## Phase F.13 (2026-05-20): walker statistics counters for algorithmic-
## bottleneck attribution. Adds 19 u64 counters to WpdaWalker tracking
## apply_action_to_cursor invocations, cursor proliferation peaks,
## merge_equivalent_cursors collapse ratios, cursor lifecycle sources/
## sinks, and Fork composition by ForkActionKind variant.
##
## Zero-cost when off: all increment macros expand to empty blocks and
## the `stats` field on WpdaWalker is conditionally compiled out.
## Verified via `cargo expand` / `cargo asm`.
##
## Output trigger: env var `PRATTAIL_WALKER_STATS=1` causes
## `resolve_at_end_of_input` to print a human-readable summary to stderr.
##
## Per-walker scope eliminates parallel-test interference (each parse
## owns its counters). No atomics/locks required (walker is single-threaded
## per parse session).
##
## Use: `cargo test --features mettail-prattail/walker-stats ... \
##       -- --nocapture` with `PRATTAIL_WALKER_STATS=1` env var.
walker-stats = []
## OSLF substrate, Phase 1 `.0`-inert (2026-06-22): the M0→M1 *carrier route*
## that wires `any_algebra::AnyAlgebra` as the unified guard-predicate carrier
## for `symbolic::analyze_from_bundle`. OFF BY DEFAULT and **inert**: when
## enabled, `analyze_from_bundle` dispatches to `analyze_from_bundle_carrier`,
## which derives `guard_satisfiability` by lifting the existing
## terminal/nonterminal-start/empty boolean into an `AnyPred` (`True`/`False`)
## and deciding it through `AnyAlgebra::is_satisfiable` over a scalar
## `SortRegistry` — producing **byte-identical** `SymbolicAnalysis` on every
## grammar (proven by `prattail/tests/guard_carrier_snapshot.rs`). The live
## flip (`.1`) is a later step. The carrier needs the real `NativeKind`
## classification, so it pulls in `mettail-ast` as an optional dependency
## (gated below); the default build is byte-for-byte unchanged.
any-algebra-carrier = ["dep:mettail-ast"]
## OSLF substrate, Phase 2 `.1`-wire (2026-06-22): route the STRUCTURAL
## refinement-type dispatch (`type_system::dispatch`) through the
## `sym_tree`-based `structural_types` recognizer instead of the string
## heuristic, so structural disjointness / subtype are decided PRECISELY by the
## symbolic tree automaton (`SymbolicTreeAutomaton<AnyAlgebra>`) over the
## grammar's ranked alphabet. When enabled,
## `pipeline::analysis::analyze_refinement_types` calls
## `analyze_refinement_dispatch_structural` (which falls back to today's
## `Overlapping` on any predicate-parse failure — never worse than status quo),
## populates `RefinementAnalysisResult::empty_intersections` from the
## structurally-disjoint pairs (so the previously-dead RT03 lint fires), and
## attaches `structural_witnesses` hints. Presburger / Mixed pairs stay on the
## existing heuristic. Runtime `match_pattern` codegen is UNTOUCHED (analysis
## only). Requires the `any-algebra-carrier` scalar-sort resolution, so it
## implies that feature. OFF BY DEFAULT; the default build is unchanged.
sym-tree-structural = ["any-algebra-carrier"]
## OSLF substrate, Phase 4 `.0`-inert (2026-06-22): expose the SHIPPED-but-dead
## `bisimulation` LTS partition-refinement engine as a pipeline entrypoint
## (`bisimulation::analyze_from_bundle`) that builds ONE `Lts` over a grammar's
## categories-as-states (each rule's nonterminal references = labeled
## transitions; the action is the regularized minterm class of the rule label,
## decided on the regular Boolean core — `DontKnow` action classes are dropped,
## never split on, per the `¬¬φ ∖ φ` invariant), runs `Lts::bisimulation`,
## certifies the partition with `Lts::is_bisimulation`, and returns a
## `BisimulationAnalysis` shaped IDENTICALLY to `alternating::AlternatingAnalysis`
## (`non_bisimilar_pairs`) so it is a drop-in at `.1`. The agreement gate
## (`prattail/tests/bisimulation_agreement_snapshot.rs`) proves it produces the
## SAME category-pair partition as `alternating::analyze_from_bundle`. `.0`-inert:
## always compiled, no live caller — the live flip (routing AWA bisimulation
## dispatch through this engine) is `.1`. The carrier needs the `AnyAlgebra`
## guard-predicate algebra for the minterm action classes, so it implies
## `any-algebra-carrier`. OFF BY DEFAULT; the default build is unchanged.
oslf-bisimulation = ["any-algebra-carrier"]
## OSLF substrate, Phase 4 `.0`-inert (2026-06-22): expose the SHIPPED-but-dead
## `sym_tree_transducer` bottom-up symbolic tree transducer as a pipeline
## entrypoint (`sym_tree_transducer::analyze_from_bundle`) that, for each
## cast/refinement rule `r : src → tgt`, builds a `SymbolicTreeTransducer`
## realizing the cast substitution over the grammar's ranked alphabet, computes
## the pre-image `domain_sta()`, decides cast totality via `is_total()`, and
## intersects the pre-image with the Phase-2
## `structural_types::category_automaton` of `src` to decide cast-reachability —
## producing a `TransducerAnalysis` (`non_total_casts`, `dead_casts`). It reuses
## the Phase-2 ranked-alphabet/tree-algebra builders, so it implies
## `sym-tree-structural`. The agreement gate
## (`prattail/tests/transducer_preimage_snapshot.rs`) proves the transducer
## pre-image accept-set agrees, category-for-category, with the Phase-2 source
## `category_automaton`. `.0`-inert: always compiled, no live caller — the live
## flip is `.1`. OFF BY DEFAULT; the default build is unchanged.
oslf-transducer = ["sym-tree-structural"]
## OSLF substrate, Phase 5 `.0`→`.1` (2026-06-22): make the SHIPPED-but-dead
## `letprop` recursive-predicate → modal-μ-calculus → Parity Alternating Tree
## Automaton (PATA) decision machinery a LIVE analysis path. When enabled,
## `parity_tree::analyze_recursive_predicates` walks the grammar's guard
## predicates for any recursive (`letprop`-style fixpoint) predicate, lowers
## each through `letprop::letprop_to_pata` (giving that SHIPPED bridge its FIRST
## real caller), and decides non-emptiness via the Zielonka-aligned
## `parity_tree::check_emptiness` (Rocq-aligned to `PataEmptiness.v`); the
## verdicts are surfaced in the `#[cfg]`-gated
## `ParityTreeAnalysis::fixpoint_decisions` field and routed into the pipeline at
## the `h_parity_tree` spawn. A dead-behavioral-type lint (`LP01`) fires when a
## recursive guard's PATA is EMPTY (the behavioral type can never be satisfied).
## NO surface syntax is added (that is a tracked follow-up that touches `ast/`),
## so on every current grammar this path finds NO recursive predicate and is
## fully INERT (empty `fixpoint_decisions`, parity-safe) — proven by the parity
## arm of `prattail/tests/letprop_pata_snapshot.rs`, while the positive arm
## exercises the live decision over a SYNTHETIC `RecursivePredicate`. The carrier
## needs the `any_algebra` guard-predicate algebra plumbing the sibling OSLF
## phases use, so it implies `any-algebra-carrier`. OFF BY DEFAULT; the default
## build is byte-for-byte unchanged.
oslf-letprop = ["any-algebra-carrier"]
## OSLF substrate, Phase 6 `.0`→`.1` (2026-06-22): make the SHIPPED-but-dead
## `hindley_milner` module a LIVE, base-sort-consistency analysis pass. When
## enabled, `hindley_milner::analyze_from_bundle` builds, for each grammar rule,
## the constructor's principal arrow type
## `HmType::Arrow(field_sort_1, …Arrow(field_sort_n, result))` from its
## `SyntaxItemSpec` fields and CHECKS that the inferred result sort `unify`s with
## the rule's declared category — recording a `sort_mismatch` iff unification
## fails. It uses ONLY `HmType::{Mono,Arrow}` + the existing `unify`/`apply`: NO
## `HmTerm`/`infer`/`Abs`/`App`, NO fresh type variables (the global
## `fresh_type_var` counter is a determinism hazard the base-sort pass never
## touches). The verdicts are surfaced in the `#[cfg]`-gated
## `HmInferenceAnalysis::sort_mismatches` field and routed into the pipeline at an
## unconditional `h_hindley` spawn (HM applies to ALL grammars — no dispatch
## gate, mirroring the refinement-sync block). A sort-mismatch lint (`HM01`) fires
## one Note per mismatch. Because every constructor field sort is read from the
## SAME `SyntaxItemSpec` that names the rule's category, the inferred result sort
## ALWAYS unifies on real grammars ⇒ this path is fully INERT (empty
## `sort_mismatches`) — proven by the parity arm of
## `prattail/tests/hindley_inference_snapshot.rs`, while the positive arm exercises
## a hand-built bundle with a deliberate sort clash. The carrier needs the
## `any_algebra` scalar-sort plumbing the sibling OSLF phases use, so it implies
## `any-algebra-carrier`. OFF BY DEFAULT; the default build is byte-for-byte
## unchanged.
oslf-hindley-milner = ["any-algebra-carrier"]
## OSLF Phase 9 `.0`-inert (2026-06-22): the parity-safe DE-DUP FOUNDATION that
## reconciles the two parallel behavioral-predicate representations in this crate
## — the runtime CARRIER `behavioral_pred::BehavioralPred` (produced by the WPDA
## walker; the runtime crate re-exports it and evaluates it via
## `evaluate_pred_with_bindings`) and the DECIDER
## `behavioral_algebra::BehavioralFormula` (the `algebra_tower`-backed relational
## classifier). When enabled, `BehavioralPred::to_behavioral_formula` lowers the
## carrier into the decider's RELATIONAL fragment by a PROVEN-CANONICAL mapping
## (negation→`Not` wrapper, `Implies`→reject-safe `¬a∨b`, `Top`→`Top`, and the
## structural `AcMatch` leg fail-closed to `None` — recursively), and
## `BehavioralPred::behavioral_tier` reads the decider's
## `decidability_tier()` off the lowered image. Because the image is the
## relational fragment ONLY (never modal), every lowered formula's tier is `T1`
## (iff `Top`) or `T2` — NEVER `T3`: that is the load-bearing parity fact, proven
## by `prattail/tests/behavioral_lowering_snapshot.rs` (tier-equivalence + an
## eval-agreement gate against the runtime evaluator on the literal/relational
## subset). `.0`-inert: the lowering has NO live caller — the eval-path
## unification (routing `evaluate_pred_with_bindings` through the lowered
## decider) is a later increment. The EVAL PATH (`evaluate_pred_with_bindings`)
## is UNTOUCHED. The carrier reuses the `any_algebra` scalar-sort plumbing the
## sibling OSLF phases use, so it implies `any-algebra-carrier`. OFF BY DEFAULT;
## the default build is byte-for-byte unchanged.
oslf-behavioral-lowering = ["any-algebra-carrier"]
## Bench-only toggles used by criterion targets. Declaring them keeps
## `cargo check --all-targets` check-cfg clean even when they are off.
wfst-log = []
set-theoretic-types = []
## Capability labels used by predicate-dispatch conformance tests.
buchi = []
alternating = []
vpa = []
parity-tree-automata = []
register-automata = []
probabilistic = []
multi-tape = []
multiset-automata = []
two-way-transducer = []
## Author-DX railroad-diagram rendering (OSLF Phase 7a, 2026-06-22). The
## `railroad` module (`prattail/src/railroad.rs`) lowers a `LanguageSpec` into
## per-category grammar diagrams. Text/ASCII rendering
## (`render_grammar_railroad_text`) is ALWAYS available and needs no dependency;
## this feature gates only the optional hand-emitted SVG output
## (`render_grammar_railroad_svg`), which likewise pulls in NO new crate
## (the SVG is written directly from the format-independent `RailroadNode`).
## Declared so `cargo check --all-targets` stays check-cfg clean. OFF BY
## DEFAULT; the default build never references railroad and is unchanged.
railroad-diagrams = []
## OSLF Phase 8 (2026-06-22): SMT-backed `ConstraintTheory` via the in-process Z3
## library (`prattail/src/logict_smt.rs`), backported from `lling-llang` with its
## soundness defect removed. OFF BY DEFAULT. When enabled it pulls in the optional
## `z3` crate (dynamically linked against the system libz3); the DEFAULT build needs
## no libz3 and is **byte-identical** (the `logict_smt` module does not compile).
##
## Sat3-ONLY doctrine: Z3 is reachable ONLY through `logict_smt::is_satisfiable_3v`
## / `checked_witness` (three-valued; `unknown → Sat3::DontKnow`, NEVER collapsed to
## `Unsat`/`Sat`). `Z3Theory` implements ONLY `ConstraintTheory` — never
## `BooleanAlgebra`/`RejectSafeAlgebra`/`HeytingAlgebra` — and is never routed into
## the SFA classical consumers (complement / determinize / equivalence). It is a
## SECONDARY gap-filler only where the verified deciders return `DontKnow`; the
## verified deciders stay PRIMARY.
smt = ["dep:z3"]

[dependencies]
# Note: prattail does NOT depend on runtime. fixed_lit/float_lit were moved
# to runtime/ to keep parser/predicate helpers on the runtime → prattail edge.
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
# Phase 6 (F.0 sibling): BehavioralPred moved here from runtime so the WPDS
# walker can produce predicates without crossing the dependency cycle.
# `BehavioralPred` impls `moniker::BoundTerm<String>` as a no-op leaf.
moniker = { workspace = true }
# Feature-branch parser/automata/presburger deps — always-on in this branch.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
proptest = { version = "1" }
num-complex = { version = "0.4" }
nalgebra = { version = "0.33" }
pathmap = { git = "https://github.com/dylon/PathMap.git", branch = "feature/mettatron-fixes" }
regex-syntax = { version = "0.8", default-features = false, features = ["unicode"] }
im = { version = "15" }
# Main-branch numeric-literal deps for BigInt/BigRat literal parsing.
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint-std"] }
num-traits = "0.2"
# Option C / C1 (2026-05-15): SPPF deduplication requires a deterministic
# hasher so dedup_packing keys are content-stable across runs and reparse
# sessions (see plan §11.5 invariant I3). Standard `RandomState` is excluded.
rustc-hash = "2"
# T4 SIGUSR1 hang-dump (optional under `hang-dump` feature).
signal-hook = { version = "0.3", optional = true }
parking_lot = { version = "0.12", optional = true }
# The weight algebra (semirings, weight types, Newton-SCC, PackingFactored,
# LexicographicWeight) lives in rigail; this crate re-exports it via
# the automata::{semiring,lex_weight} facades.
rigail = { path = "../rigail" }
# OSLF substrate `.0`-inert carrier route only (feature `any-algebra-carrier`,
# off by default). Provides the real `NativeKind` classification that
# `any_algebra::sort_of_native` / `sort_of_category` reuse, so the carrier
# resolves a category's scalar `Sort` exactly as the parser does. `ast` does
# not depend on prattail (verified: no cycle). The default build never pulls
# this in.
mettail-ast = { package = "ast", path = "../ast", optional = true }
# OSLF Phase 8 SMT backend (feature `smt`, off by default). The in-process Z3
# library, dynamically linked against the system libz3 (`/usr/lib/libz3.so`). Only
# pulled in under `--features smt`; the default build links no libz3.
z3 = { version = "0.12", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# OSLF Phase 9 eval-agreement gate (test-only). The behavioral-lowering snapshot
# (`tests/behavioral_lowering_snapshot.rs`, itself `#![cfg(feature =
# "oslf-behavioral-lowering")]`) cross-checks the lowered `BehavioralFormula`
# against the runtime carrier evaluator `evaluate_pred_with_bindings`. This is a
# DEV-dependency cycle (`runtime`'s lib → `prattail`'s lib; `prattail`'s tests →
# `runtime`), which Cargo permits because dev-dependencies never enter the lib
# build graph. It adds NO new test in the default build (the snapshot file is
# feature-gated to zero tests when the feature is off).
mettail-runtime = { package = "runtime", path = "../runtime" }

# Author-DX demo (OSLF Phase 7a): renders the always-on text railroad diagrams
# for a small in-memory `LanguageSpec`. Builds under the default feature set
# (`cargo build --examples`); adds no caller to the default pipeline.
[[example]]
name = "railroad"
path = "examples/railroad.rs"

