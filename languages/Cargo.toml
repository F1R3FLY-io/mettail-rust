# Task #14 (Option<Guard>) regeneration-hazard mitigation — RETIRED by Task #11
# (extended 2026-07-26), not weakened. The hazard was that the `language!` macro REWROTE
# `tests/gen_guardoptsmoke_*.rs` on every feature-enabled compile, silently dropping any
# hand-prepended `#![cfg(...)]` header, after which a default (featureless) build failed on
# `use mettail_languages::guardoptsmoke::*`. These three `[[test]]` stanzas gated those
# files declaratively instead.
#
# `GuardOptSmoke` is TEST-HOSTED now: its suite is spilled to `target/generated/` and pulled
# into ONE binary (`tests/guardopt_smoke.rs`, its designated host) by the
# `guardoptsmoke_generated_tests!` wrapper. No `tests/gen_guardoptsmoke_*.rs` file is
# written, none is committed, and no `use mettail_languages::guardoptsmoke::*;` header
# exists to break — so there is nothing left to gate. The stanzas are removed rather than
# repointed because their targets no longer exist.
#
# [[test]]
# name = "gen_guardoptsmoke_unit"
# path = "tests/gen_guardoptsmoke_unit.rs"
# required-features = ["guardoptsmoke"]
#
# [[test]]
# name = "gen_guardoptsmoke_prop"
# path = "tests/gen_guardoptsmoke_prop.rs"
# required-features = ["guardoptsmoke"]
#
# [[test]]
# name = "gen_guardoptsmoke_analytical"
# path = "tests/gen_guardoptsmoke_analytical.rs"
# required-features = ["guardoptsmoke"]

