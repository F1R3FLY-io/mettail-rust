[package]
name = "mettail-languages"
version = "0.1.0"
edition = "2021"

# Binaries are per-language simulation CLIs, auto-generated by the language! macro.
# Tests use separate test binaries.

[features]
## Ascent parallel fixpoint: switches ascent! → ascent_par! for parallel
## rewriting in generated language structs. Currently broken by upstream ascent bug.
ascent-parallel = ["mettail-prattail/ascent-parallel"]
## Expose public proptest strategies for generating random well-formed terms.
## External crates can depend on `mettail-languages/strategies` and use
## `arb_{cat}(max_depth)` to generate terms for property-based testing.
strategies = ["proptest"]

[dependencies]
mettail-macros = { path = "../macros" }
mettail-prattail = { path = "../prattail" }
mettail-runtime = { path = "../runtime" }
# Feature-branch: simulation crate for grammar-aware simulator.
mettail-simulation = { path = "../simulation" }
# Main-branch: numeric deps for BigInt/BigRat/FixedPoint language support.
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
moniker = { workspace = true }
rand = { workspace = true }
indexmap = { workspace = true }

ascent = { workspace = true }
ascent-byods-rels = { workspace = true }
hashbrown = { version = "0.14", features = ["raw", "rayon"] }
rustc-hash = "2.0"

# Optional: exposed via the `strategies` feature for public proptest strategies.
proptest = { version = "1", optional = true }

# Required by generated simulation CLI binaries.
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
mettail-testkit = { path = "../testkit" }

# W7 Stage 8 (parity testing): postcard golden inspector.
# No `required-features` — usable on default builds.
[[bin]]
name = "dump_golden"
path = "src/bin/dump_golden.rs"

# Per-language simulation CLI binaries (auto-generated by language! macro).
# Each binary requires the `strategies` feature for proptest term generation.

[[bin]]
name = "simulate_calculator"
path = "src/bin/simulate_calculator.rs"
required-features = ["strategies"]

[[bin]]
name = "simulate_lambda"
path = "src/bin/simulate_lambda.rs"
required-features = ["strategies"]

[[bin]]
name = "simulate_rhocalc"
path = "src/bin/simulate_rhocalc.rs"
required-features = ["strategies"]

[[bin]]
name = "simulate_ambient"
path = "src/bin/simulate_ambient.rs"
required-features = ["strategies"]

[[bin]]
name = "simulate_ledtest"
path = "src/bin/simulate_ledtest.rs"
required-features = ["strategies"]

[[bin]]
name = "simulate_basemath"
path = "src/bin/simulate_basemath.rs"
required-features = ["strategies"]

[[bin]]
name = "simulate_extmath"
path = "src/bin/simulate_extmath.rs"
required-features = ["strategies"]

[[bin]]
name = "simulate_mixedmath"
path = "src/bin/simulate_mixedmath.rs"
required-features = ["strategies"]

[[bin]]
name = "simulate_importedmath"
path = "src/bin/simulate_importedmath.rs"
required-features = ["strategies"]

[[bin]]
name = "simulate_refinementsmoke"
path = "src/bin/simulate_refinementsmoke.rs"
required-features = ["strategies"]



