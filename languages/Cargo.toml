[package]
name = "languages"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Binaries are per-language simulation CLIs, auto-generated by the language! macro.
# Tests use separate test binaries.

[lib]
name = "mettail_languages"

[features]
# dovetail-codegen is in default post-P6: Dovetail is the general-purpose
# runtime backend (Ascent retired). Without it, non-Rho generated languages
# (e.g. Calculator) advertise no runtime backend, so runtime-execution tests
# (simulation_integration, probe_neg_zero) cannot run. It joins rho-codegen
# (already default) to give the default build a complete runtime surface.
default = ["all-languages", "rho-codegen", "dovetail-codegen"]
all-languages = [
    "ac-demo",
    "ac-bag-demo",
    "nl-ac-demo",
    "amb-demo",
    "amb-new-demo",
    "in-out-demo",
    "ambient",
    "calculator",
    "comm-demo",
    "composition",
    "ctx-demo",
    "bicong-demo",
    "guarded-rho",
    "lambda",
    "lambda-demo",
    "native-demo",
    "rhocalc",
    "swap-demo",
]
ac-demo = []
ac-bag-demo = []
nl-ac-demo = []
amb-demo = []
amb-new-demo = []
in-out-demo = []
ambient = []
# Task #11 (extended 2026-07-26): `AppSubst` moved to `tests/definitions/`. A TEST-HOSTED
# definition is not a library module, so it needs no library feature; its consumers
# `#[path]`-include the definition file directly.
# appsubst = []
calculator = []
# Task #11 (extended 2026-07-26): the Class-2 / Class-3 collection FIXTURE grammars moved
# to `tests/definitions/`. A TEST-HOSTED definition is not a library module, so it needs no
# library feature; its consumers `#[path]`-include the definition file directly.
# class2hashmapsmoke = []
# class2multi = []
# class2optsmoke = []
# class2smoke = []
# class3multi = []
# class3opt = []
comm-demo = []
composition = ["calculator", "lambda"]
ctx-demo = []
bicong-demo = []
# Task #11 (extended 2026-07-26): the keyword-reservation FIXTURE twins moved to
# `tests/definitions/`; their consumers `#[path]`-include the definition files directly.
# fortran_model = []
# reserved_model = []
guarded-rho = []
# A-11 (P3.d/F1) site-2 smoke. Task #14 (2026-07-13) closed the historical
# compile blockers (15 term-ops codegen errors across 8 generated files +
# the eval classify compile_error — the emitters now carry Option<Guard>
# through every term-op opaquely), so this feature COMPILES and its
# guardopt_smoke.rs pair is the live site-2 gate. Still NOT in
# all-languages — promotion is a separate decision. The generated
# gen_guardoptsmoke_* test files are gated via [[test]] required-features
# below (regeneration-proof), not via in-file cfg.
# Task #11 (extended 2026-07-26): `GuardOptSmoke` moved to `tests/definitions/`, so the
# feature is gone and with it the regeneration hazard the note above describes: the macro
# no longer writes `tests/gen_guardoptsmoke_*.rs` at all (a test-hosted language's suite is
# spilled to `target/generated/` and pulled in by the `guardoptsmoke_generated_tests!`
# wrapper), so there is nothing left to clobber and nothing left to gate. The three
# `[[test]]` stanzas that gated those files are removed below for the same reason.
# guardoptsmoke = []
lambda = []
lambda-demo = []
# Task #11 (extended 2026-07-26): `LedTest` moved to `tests/definitions/`.
# led-test = []
native-demo = []
# Task #11 (extended 2026-07-26): `NativeFoldDemo` moved to
# `tests/definitions/nativefolddemo.rs`. A TEST-HOSTED definition is not a library
# module, so it needs no library feature; its consumers `#[path]`-include the
# definition file directly.
# native-fold-demo = []
# Task #11: `OptSmoke` moved to `tests/definitions/optsmoke.rs`. A TEST-HOSTED
# definition is not a library module, so it needs no library feature; its
# consumers `#[path]`-include the definition file directly.
# optsmoke = []
# Task #11 (extended 2026-07-26): `RefinementSmoke` moved to `tests/definitions/`.
# refinementsmoke = []
rhocalc = []
swap-demo = []
## Expose public proptest strategies for generating random well-formed terms.
## External crates can depend on `mettail-languages/strategies` and use
## `arb_{cat}(max_depth)` to generate terms for property-based testing.
strategies = ["proptest"]
## Phase F.13 H7 (2026-05-20): opt-in mimalloc global allocator for the
## `trampoline_tests` binary. Off by default per user direction
## (2026-05-20: "feature-gate mimalloc, don't enable it by default").
## Enable with `cargo test --features mimalloc ...` to apply mimalloc
## to the trampoline_tests binary; otherwise the system allocator is used.
mimalloc = ["dep:mimalloc"]
## Phase F.13 chain_10000 Plan C Substage 0 (2026-05-26): passthrough
## to enable `mettail-prattail/walker-stats` from this crate's tests
## (so trampoline_tests can run with histograms collected). Off by
## default (zero overhead); enable with
## `cargo test --features walker-stats ...`.
walker-stats = ["mettail-prattail/walker-stats"]
## Walker diagnostics/trace passthrough (2026-07-16): turns on the compile-time
## `walker-trace` gate in BOTH `prattail` (runtime parser diagnostics) and
## `macros` (codegen-time `PRATTAIL_MACRO_TRACE`). OFF BY DEFAULT / zero-cost.
## Enable with `cargo build --features walker-trace`; individual diagnostics are
## then selected at runtime by their own `PRATTAIL_*` env vars.
walker-trace = ["mettail-prattail/walker-trace", "mettail-macros/walker-trace"]
## Compile the macro-generated AST-first Rho scalar invocation descriptions.
## This is part of the default production surface: generated helpers return
## `mettail_rho_codegen::RhoScalarContractInvocation` values for the
## Dovetail/Rho installer, while still avoiding a dependency on the Rho runtime.
rho-codegen = ["dep:mettail-rholang-codegen"]
## Compile the macro-generated AST-first Dovetail report compiler. Generated
## helpers lower typed AST constructors and supported rewrite/equation rules
## directly into `dovetail::EGraph` and checked `RuntimeDovetailRunReport`
## values; unsupported side-condition families fail closed instead of falling
## back to Ascent/CESK.
dovetail-codegen = ["dep:dovetail", "dep:mettail-dovetail-runtime", "dep:rigail"]

[dependencies]
mettail-macros = { package = "macros", path = "../macros" }
mettail-prattail = { package = "prattail", path = "../prattail" }
mettail-runtime = { package = "runtime", path = "../runtime" }
mettail-rholang-codegen = { package = "rholang-codegen", path = "../rholang-codegen", optional = true }
mettail-dovetail-runtime = { package = "dovetail-runtime", path = "../dovetail-runtime", optional = true }
dovetail = { path = "../dovetail", optional = true }
rigail = { path = "../rigail", optional = true }
# Feature-branch: simulation crate for grammar-aware simulator.
mettail-simulation = { package = "simulation", path = "../simulation" }
# Main-branch: numeric deps for BigInt/BigRat/FixedPoint language support.
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
moniker = { workspace = true }
rand = { workspace = true }
indexmap = { workspace = true }

# Optional: exposed via the `strategies` feature for public proptest strategies.
proptest = { version = "1", optional = true }

# Phase F.13 H7 (2026-05-20): optional mimalloc allocator gated by the
# `mimalloc` feature. Off by default. Trampoline_tests opts in
# when run with `--features mimalloc`.
mimalloc = { version = "0.1", default-features = false, optional = true }

# Required by generated simulation CLI binaries.
clap = { version = "4.5", features = ["derive"] }

# PathMap trie (M-RHO) — backs the RhoCalc pathmap/zipper submodules; pin matches f1r3node `models` 0.2.2.
pathmap = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
rand_distr = "0.4"
mettail-testkit = { package = "testkit", path = "../testkit" }
# Lets the GuardedRho Rho-default backend test (guarded_rho_rho_backend.rs) name
# `LanguageDef` directly when reconstructing the real augmented definition. It is
# already a transitive dependency (via mettail-macros / mettail-rho-codegen);
# this only makes the type nameable from the integration test.
mettail-ast = { package = "ast", path = "../ast" }

# Regression lock proving the in-Rho set automaton is size-optimal (adaptive-`L`,
# Stage 4 task #17, is unnecessary in the interned-subterm representation). Needs the
# language modules (`all-languages`) plus the codegen ruleset compiler (`rho-codegen`)
# and the dovetail `SetAutomaton` (`dovetail-codegen`).
[[test]]
name = "set_automaton_size_optimal"
path = "tests/set_automaton_size_optimal.rs"
required-features = ["all-languages", "rho-codegen", "dovetail-codegen"]

# W7 Stage 8 (parity testing): postcard golden inspector.
# No `required-features` — usable on default builds.
[[bin]]
name = "dump_golden"
path = "src/bin/dump_golden.rs"

