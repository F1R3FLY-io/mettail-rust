syntax = "proto3";

package rhoapi;

message Par {
  repeated Expr exprs = 5;
}

message Expr {
  oneof expr_instance {
    bool g_bool = 1;
    sint64 g_int = 2;
    string g_string = 3;
    bytes g_byte_array = 25;
    EList e_list_body = 20;
    ESet e_set_body = 22;
    EMap e_map_body = 23;
  }
}

message EList {
  repeated Par ps = 1;
}

message ESet {
  repeated Par ps = 1;
}

message EMap {
  repeated KeyValuePair kvs = 1;
}

message KeyValuePair {
  Par key = 1;
  Par value = 2;
}
